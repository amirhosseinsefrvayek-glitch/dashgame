<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON DASH</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Orbitron',sans-serif;color:#fff;position:fixed}
canvas{display:block;position:fixed;inset:0;z-index:1}
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
.hud.on{display:block}
.top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px}
.box{background:rgba(10,10,25,.75);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 16px;text-align:center}
.box .lbl{font-size:9px;color:#6b6b8f;letter-spacing:2px;margin-bottom:2px}
.box .val{font-size:20px;font-weight:900}
.val.c{color:#00f0ff;text-shadow:0 0 15px #00f0ff}
.val.y{color:#ffd60a;text-shadow:0 0 15px #ffd60a}
.val.p{color:#b537f2;text-shadow:0 0 15px #b537f2}
.pbar{position:absolute;top:80px;left:50%;transform:translateX(-50%);width:240px;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#00f0ff,#b537f2);transition:width .2s;box-shadow:0 0 12px #00f0ff}
.pause{position:absolute;top:15px;right:15px;width:44px;height:44px;background:rgba(10,10,25,.75);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20;background:rgba(5,6,15,.95);backdrop-filter:blur(20px);overflow-y:auto}
.screen.on{display:flex}
.title{font-size:64px;font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#00f0ff,#b537f2,#ff2e97);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:g 3s infinite;text-align:center;margin-bottom:8px}
@keyframes g{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tag{font-size:12px;letter-spacing:8px;color:#6b6b8f;margin-bottom:30px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;width:100%;max-width:520px}
.stat{background:rgba(10,10,25,.75);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 8px;text-align:center}
.stat .v{font-size:24px;font-weight:900;background:linear-gradient(135deg,#00f0ff,#b537f2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px}
.stat .l{font-size:9px;color:#6b6b8f;letter-spacing:2px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:560px;width:100%;margin-bottom:22px}
.lvl{aspect-ratio:1;background:rgba(10,10,25,.75);border:2px solid rgba(255,255,255,.1);border-radius:14px;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;position:relative;overflow:hidden}
.lvl:hover{transform:translateY(-4px) scale(1.05);border-color:#00f0ff;box-shadow:0 8px 25px rgba(0,240,255,.3)}
.lvl .ic{font-size:22px}
.lvl .nm{font-size:9px;color:#9a9ab5;font-weight:700;text-align:center;line-height:1.1}
.lvl .pr{position:absolute;bottom:2px;left:2px;right:2px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.lvl .pr b{display:block;height:100%;background:linear-gradient(90deg,#00f0ff,#b537f2)}
.lvl.done{border-color:#06ffa5;background:rgba(6,255,165,.08)}
.btns{display:flex;flex-direction:column;gap:10px;max-width:320px;width:100%}
.btn{padding:16px 28px;background:linear-gradient(135deg,#00f0ff,#b537f2);color:#fff;border:none;border-radius:14px;font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .3s;box-shadow:0 8px 25px rgba(0,240,255,.3)}
.btn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,240,255,.5)}
.btn.sec{background:rgba(10,10,25,.75);border:1px solid rgba(255,255,255,.1);box-shadow:none}
.btn.sec:hover{border-color:#00f0ff;color:#00f0ff}
.shop-t{font-size:32px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#00f0ff,#b537f2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.shop-c{display:inline-flex;align-items:center;gap:8px;background:rgba(255,214,10,.1);border:1px solid #ffd60a;border-radius:20px;padding:8px 20px;font-size:18px;font-weight:900;color:#ffd60a;margin-bottom:18px}
.tabs{display:flex;gap:6px;background:rgba(10,10,25,.75);padding:6px;border-radius:12px;margin-bottom:18px;max-width:520px;width:100%}
.tab{flex:1;padding:10px;background:transparent;border:none;border-radius:8px;color:#6b6b8f;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#00f0ff,#b537f2);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:720px;width:100%;max-height:50vh;overflow-y:auto;padding:8px;margin-bottom:18px}
.item{background:rgba(10,10,25,.75);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .3s}
.item:hover{transform:translateY(-3px);border-color:#00f0ff}
.item.own{border-color:rgba(6,255,165,.5);background:rgba(6,255,165,.05)}
.item.eq{border-color:#ffd60a;background:rgba(255,214,10,.08);box-shadow:0 0 25px rgba(255,214,10,.25)}
.item .prev{width:60px;height:60px;margin:0 auto 10px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px}
.item .nm{font-size:12px;font-weight:700;margin-bottom:4px}
.item .pr{font-size:12px;font-weight:900;color:#ffd60a}
.item .ow{font-size:11px;font-weight:700;color:#06ffa5}
.item .eqb{font-size:11px;font-weight:700;color:#ffd60a}
.fsec{background:rgba(10,10,25,.75);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;margin-bottom:14px;max-width:520px;width:100%;grid-column:1/-1}
.fsec .ft{font-size:12px;font-weight:700;letter-spacing:2px;color:#00f0ff;margin-bottom:12px}
.fopt{display:flex;gap:8px;flex-wrap:wrap}
.fo{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s}
.fo:hover{border-color:#00f0ff;transform:scale(1.1)}
.fo.on{border-color:#00f0ff;background:rgba(0,240,255,.15);box-shadow:0 0 15px rgba(0,240,255,.4)}
.gover{text-align:center;max-width:400px;width:100%;background:rgba(10,10,25,.9);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 30px}
.gover .ic{font-size:70px;margin-bottom:15px}
.gover .ti{font-size:30px;font-weight:900;letter-spacing:4px;color:#ff2e97;margin-bottom:25px}
.gover .st{display:flex;flex-direction:column;gap:10px;margin-bottom:25px}
.gover .sr{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.03);border-radius:10px}
.gover .sr .l{color:#6b6b8f;font-size:13px}
.gover .sr .v{color:#00f0ff;font-size:18px;font-weight:900}
.notif{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(10,10,25,.95);border:2px solid #b537f2;border-radius:20px;padding:28px 44px;z-index:50;text-align:center;box-shadow:0 0 60px rgba(181,55,242,.5);pointer-events:none;opacity:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.notif.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.notif .ic{font-size:54px;margin-bottom:10px}
.notif .ti{font-size:22px;font-weight:900;letter-spacing:3px;color:#b537f2}
.notif .sb{font-size:14px;color:#9a9ab5;margin-top:4px}
.ver{position:fixed;top:15px;left:50%;transform:translateX(-50%);font-size:9px;color:#4a4a6a;letter-spacing:4px;z-index:15;pointer-events:none}
.cred{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#4a4a6a;letter-spacing:1px;z-index:15}
.cred a{color:#00f0ff;text-decoration:none;font-weight:700}
.cred a:hover{text-decoration:underline}
@media(max-width:600px){
    .title{font-size:40px;letter-spacing:3px}
    .levels{grid-template-columns:repeat(4,1fr)}
    .grid{grid-template-columns:repeat(2,1fr)}
    .val{font-size:16px!important}
    .pbar{width:180px}
    .ver{font-size:7px}.cred{font-size:9px}
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="hud" id="hud">
    <div class="top">
        <div class="box"><div class="lbl">SCORE</div><div class="val c" id="hScore">0</div></div>
        <div class="box"><div class="lbl">🪙 COINS</div><div class="val y" id="hCoins">0</div></div>
        <div class="box"><div class="lbl">LEVEL</div><div class="val p" id="hStage">1/10</div></div>
    </div>
    <div class="pbar"><div class="pfill" id="pFill"></div></div>
    <button class="pause" onclick="pause()">⏸</button>
</div>

<div class="ver">NEON DASH — V3.0</div>
<div class="cred">Create by <a href="https://amirhosseinsefrvayek-glitch.github.io/Myresume/" target="_blank">Amirhossein Hosseinzadeh</a></div>

<div class="notif" id="notif">
    <div class="ic" id="nIc">🌱</div>
    <div class="ti" id="nTi">STAGE 1</div>
    <div class="sb" id="nSb">FOREST</div>
</div>

<!-- MENU -->
<div class="screen on" id="scrMenu">
    <h1 class="title">NEON DASH</h1>
    <p class="tag">RUN • JUMP • DASH</p>
    <div class="stats">
        <div class="stat"><div class="v" id="mBest">0</div><div class="l">BEST</div></div>
        <div class="stat"><div class="v" id="mCoins">0</div><div class="l">COINS</div></div>
        <div class="stat"><div class="v" id="mChars">1</div><div class="l">CHARS</div></div>
    </div>
    <div class="levels" id="levelsList"></div>
    <div class="btns">
        <button class="btn sec" onclick="openShop()">🛒 SHOP</button>
    </div>
</div>

<!-- SHOP -->
<div class="screen" id="scrShop">
    <h2 class="shop-t">SHOP</h2>
    <div class="shop-c">🪙 <span id="sCoins">0</span></div>
    <div class="tabs">
        <button class="tab on" onclick="switchTab('colors',this)">🎨 COLORS</button>
        <button class="tab" onclick="switchTab('chars',this)">👤 CHARS</button>
        <button class="tab" onclick="switchTab('face',this)">😊 FACE</button>
    </div>
    <div class="grid" id="shopGrid"></div>
    <div class="btns" style="max-width:280px"><button class="btn sec" onclick="closeShop()">← BACK</button></div>
</div>

<!-- GAME OVER -->
<div class="screen" id="scrOver">
    <div class="gover">
        <div class="ic">💥</div>
        <div class="ti">GAME OVER</div>
        <div class="st">
            <div class="sr"><span class="l">Score</span><span class="v" id="oScore">0</span></div>
            <div class="sr"><span class="l">Coins</span><span class="v" id="oCoins">0</span></div>
            <div class="sr"><span class="l">Best</span><span class="v" id="oBest">0</span></div>
        </div>
        <div class="btns">
            <button class="btn" onclick="retry()">🔄 RETRY</button>
            <button class="btn sec" onclick="goMenu()">🏠 MENU</button>
        </div>
    </div>
</div>

<!-- LEVEL COMPLETE -->
<div class="screen" id="scrWin">
    <div class="gover">
        <div class="ic">🏆</div>
        <div class="ti" style="color:#06ffa5">LEVEL COMPLETE!</div>
        <div class="st">
            <div class="sr"><span class="l">Level</span><span class="v" id="wLvl">1</span></div>
            <div class="sr"><span class="l">Score</span><span class="v" id="wScore">590</span></div>
            <div class="sr"><span class="l">Coins</span><span class="v" id="wCoins">0</span></div>
        </div>
        <div class="btns">
            <button class="btn" onclick="nextLevel()" id="btnNext">▶ NEXT LEVEL</button>
            <button class="btn sec" onclick="goMenu()">🏠 MENU</button>
        </div>
    </div>
</div>

// ============================================
// AUDIO
// ============================================
let AC=null;
function initAudio(){if(!AC)try{AC=new(AudioContext||webkitAudioContext)()}catch(e){}}
function beep(f,d,t='sine',v=0.08){
    if(!AC)return;
    try{
        const o=AC.createOscillator(),g=AC.createGain();
        o.type=t;o.frequency.value=f;g.gain.value=v;
        g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
        o.connect(g);g.connect(AC.destination);
        o.start();o.stop(AC.currentTime+d);
    }catch(e){}
}

// STATE
// ============================================
let game = {
    on:false, over:false, paused:false, won:false,
    score:0, coins:0,
    lvlIdx:0, colorIdx:0, speed:4.5, gravity:0.6, jumpF:-15,
    groundY:0, frame:0,
    player:{x:100,y:0,size:42,vy:0,rot:0,onGround:true},
    obs:[], coinList:[], parts:[], lines:[],
    spawnT:0, coinT:0, lastPat:''
};

const getLvl = () => LEVELS[game.lvlIdx] || LEVELS[0];
const getTheme = () => getLvl().themes[game.colorIdx % getLvl().themes.length];

function getColor(){
    if (G.face.body !== 'auto' && COLORS[G.face.body]) return COLORS[G.face.body];
    return COLORS[G.eqColor] || COLORS.cyan;
}

let shopTab='colors';

function switchTab(t,btn){

}
function renderShop(){

    g.innerHTML='';

                <div class="prev" style="background:${bg};box-shadow:0 0 20px ${c.p}"></div>

    } else if(shopTab==='chars'){

            const c=CHARS[k];
            const own=G.ownChars.includes(k);

            const el=document.createElement('div');
            el.className='item'+(own?' own':'')+(eq?' eq':'');

                <div class="prev" style="background:rgba(255,255,255,.04)">${c.e}</div>

        });
        eh+='</div>';
        eye.innerHTML=eh;
        g.appendChild(eye);
        // Mouth
        const mouth=document.createElement('div');
        mouth.className='fsec';
        let mh=`<div class="ft">MOUTH</div><div class="fopt">`;
        Object.keys(MOUTHS).forEach(k=>{
            mh+=`<div class="fo ${G.face.mouth===k?'on':''}" onclick="setFace('mouth','${k}')">${MOUTHS[k]}</div>`;
        });
        mh+='</div>';
        mouth.innerHTML=mh;
        g.appendChild(mouth);
        // Body
        const body=document.createElement('div');
        body.className='fsec';
        let bh=`<div class="ft">BODY COLOR</div><div class="fopt">`;
        bh+=`<div class="fo ${G.face.body==='auto'?'on':''}" onclick="setFace('body','auto')" style="background:linear-gradient(135deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f)"></div>`;

            const c=COLORS[k];
            const bg=c.rb?'linear-gradient(135deg,#f00,#0ff,#b3f)':c.p;
            bh+=`<div class="fo ${G.face.body===k?'on':''}" onclick="setFace('body','${k}')" style="background:${bg}"></div>`;

        bh+='</div>';
        body.innerHTML=bh;

function setFace(t,v){G.face[t]=v;save();renderShop();beep(800,.06)}
function buyColor(k){
    const c=COLORS[k];
    if(G.ownColors.includes(k)){
        G.eqColor=k;G.face.body='auto';
        save();renderShop();beep(800,.08);
    } else if(G.coins>=c.price){
        G.coins-=c.price;G.ownColors.push(k);G.eqColor=k;G.face.body='auto';
        save();document.getElementById('sCoins').textContent=G.coins;renderShop();
        beep(900,.1);setTimeout(()=>beep(1200,.1),80);
    } else beep(200,.2,'sawtooth');
}
function buyChar(k){
    const c=CHARS[k];
    if(G.ownChars.includes(k)){
        G.eqChar=k;save();renderShop();beep(800,.08);
    } else if(G.coins>=c.price){
        G.coins-=c.price;G.ownChars.push(k);G.eqChar=k;
        save();document.getElementById('sCoins').textContent=G.coins;renderShop();
        beep(900,.1);setTimeout(()=>beep(1200,.1),80);

}

// ============================================
// START
// ============================================
function startLevel(idx){
    initAudio();
    showScreen(null);
    showHUD(true);
    game.on=true;game.over=false;game.paused=false;game.won=false;
    game.score=0;game.coins=0;
    game.lvlIdx=idx;game.colorIdx=0;
    game.obs=[];game.coinList=[];game.parts=[];game.lines=[];
    game.spawnT=0;game.coinT=0;game.frame=0;game.lastPat='';

    const lv=getLvl();
    game.speed=lv.speed;
    game.groundY=H-80;
    game.player.x=100;
    game.player.y=game.groundY-game.player.size;
    game.player.vy=0;game.player.rot=0;game.player.onGround=true;

    updateHUD();
    onStageChange(lv);
    loop();
}

function retry(){startLevel(game.lvlIdx)}

function nextLevel(){
    if(game.lvlIdx<LEVELS.length-1){
        startLevel(game.lvlIdx+1);
    } else {
        goMenu();
    }
}

function goMenu(){
    game.on=false;game.over=false;
    showScreen('scrMenu');updateMenu();showHUD(false);
}

function pause(){
    if(!game.on||game.over||game.won)return;
    game.paused=!game.paused;
    document.querySelector('.pause').textContent=game.paused?'▶':'⏸';
}

// ============================================
// LOOP
// ============================================
function loop(){
    if(!game.on)return;
    if(!game.paused&&!game.over&&!game.won)update();
    render();
    requestAnimationFrame(loop);
}

function update(){
    game.frame++;

    // Color change every 30 points within same level
    const newColorIdx = Math.floor(game.score / 30) % getLvl().themes.length;
    if(newColorIdx !== game.colorIdx){
        game.colorIdx = newColorIdx;
    }

    // Progress save (of 590)
    const lv=getLvl();
    const prog=Math.min(Math.floor((game.score/LEVEL_TARGET)*100),100);
    if(prog>(G.progress[lv.num]||0)){
        G.progress[lv.num]=prog;
    }

    // Level complete!
    if(game.score >= LEVEL_TARGET){
        levelComplete();
        return;
    }

    updatePlayer();
    updateObs();
    updateCoins();
    updateParts();

    game.spawnT++;
    if(game.spawnT>=lv.gap){
        game.spawnT=0;
        spawnPattern(lv);
    }

    game.coinT++;
    if(game.coinT>=55){
        game.coinT=0;
        spawnCoin();
    }

    if(game.frame%4===0){
        game.score++;
        updateHUD();
    }

    if(game.frame%2===0){
        game.lines.push({x:W,life:1});
    }
    game.lines.forEach((l,i)=>{
        l.x-=game.speed;l.life-=.03;
        if(l.life<=0)game.lines.splice(i,1);
    });
}

function updatePlayer(){
    const p=game.player;
    p.vy+=game.gravity;p.y+=p.vy;
    if(p.y+p.size>=game.groundY){
        p.y=game.groundY-p.size;p.vy=0;p.onGround=true;p.rot*=.85;
    } else {
        p.onGround=false;p.rot+=.12;
    }
}

function updateObs(){
    for(let i=game.obs.length-1;i>=0;i--){
        const o=game.obs[i];
        o.x-=game.speed;
        if(hit(game.player,o)){gameOver();return}
        if(o.x+o.w<-100)game.obs.splice(i,1);
    }
}

function updateCoins(){
    for(let i=game.coinList.length-1;i>=0;i--){
        const c=game.coinList[i];
        c.x-=game.speed;c.bob+=.15;
        if(hitCoin(game.player,c)){
            game.coins++;G.coins++;updateHUD();
            beep(1000,.06);setTimeout(()=>beep(1300,.06),40);
            for(let j=0;j<8;j++){
                game.parts.push({
                    x:c.x+c.size/2,y:c.y+c.size/2,
                    vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,
                    life:1,color:'#ffd60a',size:3
                });
            }
            game.coinList.splice(i,1);
        } else if(c.x<-100)game.coinList.splice(i,1);
    }
}

function updateParts(){
    for(let i=game.parts.length-1;i>=0;i--){
        const p=game.parts[i];
        p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life-=.025;
        if(p.life<=0)game.parts.splice(i,1);
    }
}

// ============================================
// SPAWN
// ============================================
function spawnPattern(lv){
    let pat=lv.patterns[Math.floor(Math.random()*lv.patterns.length)];
    if(lv.patterns.length>1){
        let tries=0;
        while(pat===game.lastPat&&tries<4){
            pat=lv.patterns[Math.floor(Math.random()*lv.patterns.length)];
            tries++;
        }
    }
    game.lastPat=pat;
    const x=W+40,gy=game.groundY;

    if(pat==='single')game.obs.push({x,y:gy-42,w:42,h:42,type:'box'});
    else if(pat==='double'){
        game.obs.push({x,y:gy-42,w:45,h:42,type:'box'});
        game.obs.push({x:x+90,y:gy-42,w:45,h:42,type:'box'});
    }
    else if(pat==='triangle')game.obs.push({x,y:gy-52,w:48,h:52,type:'tri'});
    else if(pat==='stairs'){
        game.obs.push({x,y:gy-38,w:40,h:38,type:'box'});
        game.obs.push({x:x+70,y:gy-62,w:40,h:62,type:'box'});
        game.obs.push({x:x+140,y:gy-88,w:40,h:88,type:'box'});
    }
    else if(pat==='wall')game.obs.push({x,y:gy-95,w:32,h:95,type:'box'});
    else if(pat==='floating'){
        game.obs.push({x,y:gy-145,w:65,h:32,type:'box'});
        game.obs.push({x:x+165,y:gy-42,w:42,h:42,type:'box'});
    }
    else if(pat==='combo'){
        game.obs.push({x,y:gy-42,w:40,h:42,type:'box'});
        game.obs.push({x:x+90,y:gy-48,w:42,h:48,type:'tri'});
        game.obs.push({x:x+180,y:gy-42,w:40,h:42,type:'box'});
    }
}

function spawnCoin(){
    const close=game.obs.some(o=>o.x>W-140);
    if(close)return;
    const y=game.groundY;
    const patterns=[
        [{x:W+40,y:y-160}],
        [{x:W+40,y:y-130},{x:W+90,y:y-130},{x:W+140,y:y-130}],
        [{x:W+40,y:y-90},{x:W+80,y:y-160},{x:W+120,y:y-90}]
    ];
    const p=patterns[Math.floor(Math.random()*patterns.length)];
    p.forEach(pos=>game.coinList.push({x:pos.x,y:pos.y,size:30,bob:Math.random()*6}));
}

// ============================================
// COLLISION
// ============================================
function hit(p,o){
    const px=p.x+6,py=p.y+6,ps=p.size-12;
    return px<o.x+o.w&&px+ps>o.x&&py<o.y+o.h&&py+ps>o.y;
}
function hitCoin(p,c){
    const dx=(p.x+p.size/2)-(c.x+c.size/2);
    const dy=(p.y+p.size/2)-(c.y+c.size/2);
    return Math.sqrt(dx*dx+dy*dy)<p.size/2+c.size/2;
}

// ============================================
// JUMP
// ============================================
function jump(){
    if(!game.on||game.over||game.paused||game.won)return;
    if(game.player.onGround){
        game.player.vy=game.jumpF;game.player.onGround=false;
        beep(600,.08,'square',.05);
        const c=getColor();
        for(let i=0;i<6;i++){
            game.parts.push({
                x:game.player.x+game.player.size/2,
                y:game.player.y+game.player.size,
                vx:(Math.random()-.5)*5,vy:Math.random()*3,
                life:1,color:c.p,size:3
            });
        }
    }
}

// ============================================
// STAGE / HUD
// ============================================
function onStageChange(lv){
    beep(500,.1);setTimeout(()=>beep(700,.1),100);setTimeout(()=>beep(900,.15),200);
    document.getElementById('nIc').textContent=lv.ic;
    document.getElementById('nTi').textContent='LEVEL '+lv.num;
    document.getElementById('nSb').textContent=lv.name;
    const n=document.getElementById('notif');
    n.classList.add('on');
    setTimeout(()=>n.classList.remove('on'),2000);
    updateHUD();
}

function updateHUD(){
    document.getElementById('hScore').textContent=game.score;
    document.getElementById('hCoins').textContent=game.coins;
    document.getElementById('hStage').textContent=(game.lvlIdx+1)+'/10';
    const prog=Math.min((game.score/LEVEL_TARGET)*100,100);
    document.getElementById('pFill').style.width=prog+'%';
}

// ============================================
// RENDER
// ============================================
function render(){
    const t=getTheme();

    const bg=cx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,t.bg1);bg.addColorStop(1,t.bg2);
    cx.fillStyle=bg;cx.fillRect(0,0,W,H);

    cx.fillStyle='rgba(255,255,255,.22)';
    for(let i=0;i<50;i++){
        const sx=(i*137+game.frame*.4)%W;
        const sy=(i*89)%(H-150);
        cx.fillRect(sx,sy,2,2);
    }

    const gg=cx.createLinearGradient(0,game.groundY-10,0,H);
    gg.addColorStop(0,t.g);gg.addColorStop(1,'rgba(0,0,0,.5)');
    cx.fillStyle=gg;cx.fillRect(0,game.groundY,W,H-game.groundY);

    cx.fillStyle=t.g;cx.shadowColor=t.g;cx.shadowBlur=25;
    cx.fillRect(0,game.groundY-3,W,3);cx.shadowBlur=0;

    game.lines.forEach(l=>{
        cx.fillStyle=t.g;cx.globalAlpha=l.life*.5;
        cx.fillRect(l.x,game.groundY+5,25,2);
    });
    cx.globalAlpha=1;

    game.obs.forEach(o=>{
        cx.shadowColor=t.a;cx.shadowBlur=22;
        cx.fillStyle=t.a;
        if(o.type==='tri'){
            cx.beginPath();
            cx.moveTo(o.x+o.w/2,o.y);
            cx.lineTo(o.x+o.w,o.y+o.h);
            cx.lineTo(o.x,o.y+o.h);
            cx.closePath();cx.fill();
            cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=2;cx.stroke();
        } else {
            rr(cx,o.x,o.y,o.w,o.h,6);cx.fill();
            cx.strokeStyle='rgba(255,255,255,.9)';cx.lineWidth=2;
            rr(cx,o.x,o.y,o.w,o.h,6);cx.stroke();
        }
        cx.shadowBlur=0;
    });

    game.coinList.forEach(c=>{
        cx.save();
        cx.translate(c.x+c.size/2,c.y+c.size/2+Math.sin(c.bob)*5);
        cx.shadowColor='#ffd60a';cx.shadowBlur=28;
        cx.fillStyle='#ffd60a';
        cx.beginPath();cx.arc(0,0,c.size/2,0,Math.PI*2);cx.fill();
        cx.shadowBlur=0;
        cx.fillStyle='#ccaa00';
        cx.beginPath();cx.arc(0,0,c.size/2-4,0,Math.PI*2);cx.fill();
        cx.fillStyle='#ffd60a';
        cx.font='bold 16px Orbitron';cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText('$',0,1);
        cx.restore();
    });

    game.parts.forEach(p=>{
        cx.globalAlpha=p.life;
        cx.fillStyle=p.color;
        cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fill();
    });
    cx.globalAlpha=1;

    renderPlayer();

    const vg=cx.createRadialGradient(W/2,H/2,H/3,W/2,H/2,H);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.55)');
    cx.fillStyle=vg;cx.fillRect(0,0,W,H);
}

function renderPlayer(){
    const p=game.player;
    const c=getColor();
    const ch=CHARS[G.eqChar]||CHARS.default;

    cx.save();
    cx.translate(p.x+p.size/2,p.y+p.size/2);
    cx.rotate(p.rot);
    cx.shadowColor=c.p;cx.shadowBlur=32;

    if(ch.e!=='⬛'){
        cx.font=`${p.size}px serif`;
        cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText(ch.e,0,2);
    } else {
        const g=cx.createLinearGradient(-p.size/2,-p.size/2,p.size/2,p.size/2);
        if(c.rb){
            const hue=(game.frame*3)%360;
            g.addColorStop(0,`hsl(${hue},100%,60%)`);
            g.addColorStop(1,`hsl(${(hue+60)%360},100%,50%)`);
        } else {
            g.addColorStop(0,c.p);g.addColorStop(1,c.s);
        }
        cx.fillStyle=g;
        rr(cx,-p.size/2,-p.size/2,p.size,p.size,8);cx.fill();
        cx.shadowBlur=0;
        cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=2;
        rr(cx,-p.size/2+6,-p.size/2+6,p.size-12,p.size-12,5);cx.stroke();
        drawFace();
    }
    cx.restore();cx.shadowBlur=0;
}

function drawFace(){
    const eye=G.face.eye,mouth=G.face.mouth;
    cx.fillStyle='white';cx.strokeStyle='#05060f';cx.lineWidth=2;

    if(eye==='normal'){
        cx.beginPath();cx.arc(-7,-4,4,0,Math.PI*2);cx.arc(7,-4,4,0,Math.PI*2);cx.fill();
        cx.fillStyle='#05060f';
        cx.beginPath();cx.arc(-7,-3,2,0,Math.PI*2);cx.arc(7,-3,2,0,Math.PI*2);cx.fill();
    } else if(eye==='happy'){
        cx.beginPath();cx.arc(-7,-4,4,Math.PI,0);cx.stroke();
        cx.beginPath();cx.arc(7,-4,4,Math.PI,0);cx.stroke();
    } else if(eye==='angry'){
        cx.beginPath();cx.moveTo(-11,-8);cx.lineTo(-3,-6);cx.stroke();
        cx.beginPath();cx.moveTo(11,-8);cx.lineTo(3,-6);cx.stroke();
        cx.fillStyle='#05060f';
        cx.beginPath();cx.arc(-7,-2,2,0,Math.PI*2);cx.arc(7,-2,2,0,Math.PI*2);cx.fill();
    } else if(eye==='cool'){
        cx.fillStyle='#05060f';cx.fillRect(-12,-7,10,6);cx.fillRect(2,-7,10,6);
        cx.beginPath();cx.moveTo(-2,-4);cx.lineTo(2,-4);cx.stroke();
    } else if(eye==='wink'){
        cx.beginPath();cx.arc(-7,-4,4,0,Math.PI*2);cx.fill();
        cx.fillStyle='#05060f';
        cx.beginPath();cx.arc(-7,-3,2,0,Math.PI*2);cx.fill();
        cx.beginPath();cx.moveTo(3,-4);cx.lineTo(11,-4);cx.stroke();
    } else if(eye==='heart'){
        cx.fillStyle='#ff2e97';cx.font='11px serif';cx.textAlign='center';
        cx.fillText('❤',-7,-1);cx.fillText('❤',7,-1);
    } else if(eye==='star'){
        cx.fillStyle='#ffd60a';cx.font='11px serif';cx.textAlign='center';
        cx.fillText('★',-7,-1);cx.fillText('★',7,-1);
    } else if(eye==='dead'){
        cx.strokeStyle='#fff';cx.lineWidth=2;
        cx.beginPath();
        cx.moveTo(-11,-8);cx.lineTo(-3,0);
        cx.moveTo(-3,-8);cx.lineTo(-11,0);
        cx.moveTo(3,-8);cx.lineTo(11,0);
        cx.moveTo(11,-8);cx.lineTo(3,0);
        cx.stroke();
    }

    cx.strokeStyle='#05060f';cx.fillStyle='#05060f';cx.lineWidth=2;
    if(mouth==='smile'){cx.beginPath();cx.arc(0,4,4,.2*Math.PI,.8*Math.PI);cx.stroke()}
    else if(mouth==='neutral'){cx.beginPath();cx.moveTo(-4,6);cx.lineTo(4,6);cx.stroke()}
    else if(mouth==='sad'){cx.beginPath();cx.arc(0,10,4,1.2*Math.PI,1.8*Math.PI);cx.stroke()}
    else if(mouth==='open'){cx.beginPath();cx.arc(0,6,4,0,Math.PI*2);cx.fill()}
    else if(mouth==='laugh'){
        cx.beginPath();cx.arc(0,4,5,0,Math.PI);cx.fill();
        cx.fillStyle='white';cx.fillRect(-2,4,4,2);
    } else if(mouth==='tongue'){
        cx.beginPath();cx.arc(0,4,4,.2*Math.PI,.8*Math.PI);cx.stroke();
        cx.fillStyle='#ff3860';
        cx.beginPath();cx.ellipse(0,8,2,3,0,0,Math.PI*2);cx.fill();
    } else if(mouth==='kiss'){
        cx.fillStyle='#ff3860';
        cx.beginPath();cx.ellipse(0,6,3,2,0,0,Math.PI*2);cx.fill();
    } else if(mouth==='fire'){
        cx.fillStyle='#ff8c42';cx.font='8px serif';cx.textAlign='center';
        cx.fillText('🔥',0,8);
    }
}

function rr(cx,x,y,w,h,r){
    cx.beginPath();
    cx.moveTo(x+r,y);
    cx.arcTo(x+w,y,x+w,y+h,r);
    cx.arcTo(x+w,y+h,x,y+h,r);
    cx.arcTo(x,y+h,x,y,r);
    cx.arcTo(x,y,x+w,y,r);
    cx.closePath();
}

// ============================================
// GAME OVER / WIN
// ============================================
function gameOver(){
    game.over=true;game.on=false;
    beep(150,.4,'sawtooth',.1);
    if(game.score>G.best)G.best=game.score;
    const lv=getLvl();
    const prog=Math.min(Math.floor((game.score/LEVEL_TARGET)*100),100);
    if(prog>(G.progress[lv.num]||0))G.progress[lv.num]=prog;
    save();
    document.getElementById('oScore').textContent=game.score;
    document.getElementById('oCoins').textContent=game.coins;
    document.getElementById('oBest').textContent=G.best;
    showHUD(false);
    showScreen('scrOver');
}

function levelComplete(){
    game.won=true;game.on=false;
    beep(500,.15);setTimeout(()=>beep(700,.15),100);setTimeout(()=>beep(1000,.3),200);
    const lv=getLvl();
    G.progress[lv.num]=100;
    G.completed[lv.num]=true;
    if(game.score>G.best)G.best=game.score;
    save();
    document.getElementById('wLvl').textContent=lv.num;
    document.getElementById('wScore').textContent=game.score;
    document.getElementById('wCoins').textContent=game.coins;
    // Hide next button if last level
    document.getElementById('btnNext').style.display = game.lvlIdx < LEVELS.length-1 ? 'flex' : 'none';
    showHUD(false);
    showScreen('scrWin');
}

// ============================================
// INPUT
// ============================================
addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
        e.preventDefault();jump();
    }
    if(e.code==='Escape'&&game.on)pause();
});
cv.addEventListener('mousedown',()=>{if(game.on&&!game.over&&!game.paused&&!game.won)jump()});
cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(game.on&&!game.over&&!game.paused&&!game.won)jump();
},{passive:false});

// ============================================
// INIT
// ============================================
updateMenu();

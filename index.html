<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #b537f2;
            --neon-pink: #ff2e97;
            --neon-yellow: #ffd60a;
            --neon-green: #06ffa5;
            --bg-dark: #030309;
            --text: #ffffff;
            --text-dim: #6b6b8f;
            --text-soft: #9a9ab5;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 240, 255, 0.4);
            --glass: rgba(10, 10, 25, 0.75);
            --glass-strong: rgba(10, 10, 25, 0.95);
        }

        html, body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }

        /* Animated background stars */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-layer::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(181, 55, 242, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 46, 151, 0.04) 0%, transparent 60%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Stars */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        #gameCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* ============================================
           HUD
           ============================================ */
        .hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        .hud.active { display: block; }

        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .hud-box {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 18px;
            pointer-events: auto;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hud-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0.5;
        }

        .hud-box.score { color: var(--neon-cyan); }
        .hud-box.coins { color: var(--neon-yellow); }
        .hud-box.stage { color: var(--neon-purple); }

        .hud-label {
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .hud-value {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
            color: inherit;
            text-shadow: 0 0 20px currentColor;
        }

        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
            transition: all 0.3s;
        }

        .pause-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        /* Stage progress */
        .stage-progress {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            pointer-events: none;
        }

        .stage-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 3px;
            transition: width 0.3s;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* ============================================
           SCREENS
           ============================================ */
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
            background: rgba(3, 3, 9, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
            animation: screenIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes screenIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================================
           TITLE SCREEN
           ============================================ */
        .title-box {
            text-align: center;
            max-width: 700px;
            width: 100%;
            animation: floatIn 0.8s ease;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 88px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
            position: relative;
            text-shadow: 0 0 60px rgba(0, 240, 255, 0.5);
            line-height: 1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .title-tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 10px;
            color: var(--text-dim);
            margin-bottom: 50px;
            font-weight: 500;
        }

        /* ============================================
           MENU STATS
           ============================================ */
        .menu-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 30px;
        }

        .menu-stat {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 12px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .menu-stat::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-stat:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
        }

        .menu-stat:hover::before { opacity: 1; }

        .menu-stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .menu-stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 6px;
        }

        .menu-stat-label {
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ============================================
           STAGES PANEL
           ============================================ */
        .stages-panel {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            max-height: 300px;
            overflow-y: auto;
            position: relative;
        }

        .stages-panel::-webkit-scrollbar { width: 4px; }
        .stages-panel::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 2px;
        }

        .stages-panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            margin-bottom: 16px;
            text-align: center;
        }

        .stage-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 10px;
            transition: all 0.25s;
            cursor: pointer;
        }

        .stage-row:hover {
            transform: translateX(5px);
            border-color: var(--border-hover);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.15);
        }

        .stage-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .stage-info {
            flex: 1;
            min-width: 0;
        }

        .stage-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .stage-diff {
            display: flex;
            gap: 3px;
            align-items: center;
            margin-bottom: 5px;
        }

        .diff-star {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }

        .diff-star.filled {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        .stage-progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .stage-progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 2px;
            transition: width 0.6s;
        }

        .stage-percent {
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-align: right;
            flex-shrink: 0;
            min-width: 50px;
        }

        .stage-percent.complete {
            color: var(--neon-green);
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 340px;
            width: 100%;
            margin: 0 auto;
        }

        .menu-btn {
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            border: none;
            border-radius: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .menu-btn:hover::before { left: 100%; }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(0, 240, 255, 0.45);
        }

        .menu-btn:active {
            transform: translateY(-1px);
        }

        .menu-btn.secondary {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
            backdrop-filter: blur(20px);
        }

        .menu-btn.secondary:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
        }

        /* ============================================
           SHOP
           ============================================ */
        .shop-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .shop-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .shop-coins {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 214, 10, 0.1);
            border: 1px solid var(--neon-yellow);
            border-radius: 30px;
            padding: 10px 24px;
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            color: var(--neon-yellow);
            box-shadow: 0 0 30px rgba(255, 214, 10, 0.25);
        }

        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            background: var(--glass);
            padding: 8px;
            border-radius: 16px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--border);
        }

        .shop-tab {
            flex: 1;
            padding: 12px 18px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-soft);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s;
        }

        .shop-tab.active {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
        }

        .shop-tab:hover:not(.active) {
            color: var(--text);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            max-width: 750px;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
        }

        .shop-grid::-webkit-scrollbar { width: 4px; }
        .shop-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 2px;
        }

        .shop-item {
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .shop-item:hover {
            transform: translateY(-4px);
            border-color: var(--neon-cyan);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.2);
        }

        .shop-item.owned {
            border-color: rgba(6, 255, 165, 0.5);
            background: rgba(6, 255, 165, 0.05);
        }

        .shop-item.equipped {
            border-color: var(--neon-yellow);
            background: rgba(255, 214, 10, 0.08);
            box-shadow: 0 0 30px rgba(255, 214, 10, 0.25);
        }

        .shop-item-preview {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .shop-item-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .shop-item-price {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 900;
            color: var(--neon-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .shop-item-owned {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-green);
            letter-spacing: 1px;
        }

        .shop-item-equipped {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            font-weight: 700;
            color: var(--neon-yellow);
            letter-spacing: 1px;
        }

        /* ============================================
           FACE CUSTOMIZER
           ============================================ */
        .face-section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 22px;
            margin-bottom: 16px;
            max-width: 520px;
            width: 100%;
        }

        .face-section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .face-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .face-option {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.25s;
        }

        .face-option:hover {
            border-color: var(--neon-cyan);
            transform: scale(1.1);
        }

        .face-option.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* ============================================
           GAME OVER
           ============================================ */
        .gameover-box {
            text-align: center;
            max-width: 420px;
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 45px 35px;
            position: relative;
            overflow: hidden;
        }

        .gameover-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
        }

        .gameover-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255, 46, 151, 0.5));
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px) rotate(-5deg); }
            75% { transform: translateX(8px) rotate(5deg); }
        }

        .gameover-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 5px;
            color: var(--neon-pink);
            margin-bottom: 25px;
            text-shadow: 0 0 30px rgba(255, 46, 151, 0.5);
        }

        .gameover-stats {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .gameover-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .gameover-stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .gameover-stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px currentColor;
        }

        /* ============================================
           STAGE NOTIFICATION
           ============================================ */
        .stage-notif {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--glass-strong);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 2px solid var(--neon-purple);
            border-radius: 24px;
            padding: 30px 50px;
            z-index: 50;
            text-align: center;
            box-shadow: 0 0 80px rgba(181, 55, 242, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stage-notif.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .stage-notif-icon {
            font-size: 60px;
            margin-bottom: 12px;
            animation: floatUp 1s ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .stage-notif-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--neon-purple);
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(181, 55, 242, 0.8);
        }

        .stage-notif-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-soft);
            letter-spacing: 2px;
        }

        /* ============================================
           VERSION + CREDIT
           ============================================ */
        .version {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 4px;
            z-index: 15;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.6;
        }

        .credit {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
            z-index: 15;
            pointer-events: auto;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .credit:hover { opacity: 1; }

        .credit a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            position: relative;
        }

        .credit a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--neon-cyan);
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .credit a:hover::after { width: 100%; }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 700px) {
            .title-text { font-size: 56px; letter-spacing: 5px; }
            .title-tagline { font-size: 11px; letter-spacing: 6px; margin-bottom: 35px; }
            .menu-stat-value { font-size: 22px; }
            .menu-stat-icon { font-size: 20px; }
            .shop-title { font-size: 26px; letter-spacing: 3px; }
            .gameover-title { font-size: 26px; letter-spacing: 3px; }
            .gameover-icon { font-size: 60px; }
            .hud-value { font-size: 18px; }
            .hud-box { padding: 8px 12px; }
            .stage-progress { width: 180px; top: 80px; }
            .version { font-size: 8px; top: 10px; letter-spacing: 3px; }
            .credit { font-size: 10px; bottom: 8px; }
            .stage-notif { padding: 20px 30px; }
            .stage-notif-icon { font-size: 45px; }
            .stage-notif-title { font-size: 18px; }
        }

        @media (max-width: 400px) {
            .title-text { font-size: 42px; }
            .menu-btn { padding: 15px 24px; font-size: 13px; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
    </style>
</head>

    <!-- ============================================

            <h2 class="shop-title">SHOP</h2>

        </div>

        <div class="shop-tabs">
            <button class="shop-tab active" onclick="switchShopTab('colors', this)">🎨 COLORS</button>
            <button class="shop-tab" onclick="switchShopTab('chars', this)">👤 CHARS</button>
            <button class="shop-tab" onclick="switchShopTab('face', this)">😊 FACE</button>
        </div>

        <div class="shop-grid" id="shopGrid"></div>

        <div class="menu-buttons" style="max-width: 320px;">

    <!-- ============================================
         GAME OVER SCREEN
         ============================================ -->

                    <span class="gameover-stat-label">Best</span>

<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gravity Flip Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #05080d;
            color: #e6edf3;
            font-family: 'Vazirmatn', 'Inter', 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            flex-direction: column;
        }

        html[dir="ltr"] body {
            font-family: 'Inter', 'Vazirmatn', sans-serif;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            height: 100vh;
            max-height: 720px;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 0 80px rgba(0, 217, 255, 0.15);
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ====== HUD ====== */
        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
            gap: 10px;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            min-width: 80px;
            text-align: center;
        }

        .hud-label {
            font-size: 10px;
            color: #8b949e;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .hud-value {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hud-stage {
            flex: 1;
            max-width: 200px;
        }

        .stage-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }

        .stage-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d9ff, #7c3aed);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* ====== Overlays ====== */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 13, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            z-index: 100;
            transition: opacity 0.4s ease;
            overflow-y: auto;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .overlay-icon {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .overlay-title {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .overlay-subtitle {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 25px;
            max-width: 500px;
            line-height: 1.8;
        }

        .overlay-hint {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 217, 255, 0.08);
            border: 1px solid rgba(0, 217, 255, 0.25);
            border-radius: 12px;
            padding: 10px 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #00d9ff;
        }

        .overlay-hint .key {
            background: #00d9ff;
            color: #05080d;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 12px;
        }

        .play-btn {
            padding: 16px 45px;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.25);
            letter-spacing: 0.5px;
            margin: 6px;
        }

        .play-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 217, 255, 0.45);
        }

        .play-btn:active {
            transform: translateY(-1px) scale(1.01);
        }

        .play-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .play-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        /* ====== انتخاب زبان ====== */
        .lang-select-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .lang-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px 40px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-width: 140px;
        }

        .lang-card:hover {
            transform: translateY(-5px);
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.08);
        }

        .lang-card-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .lang-card-name {
            font-size: 16px;
            font-weight: 700;
            color: #e6edf3;
        }

        /* ====== انتخاب شخصیت ====== */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            max-width: 600px;
            width: 100%;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .char-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .char-card.selected {
            border-color: var(--char-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 25px var(--char-glow);
        }

        .char-preview {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            margin: 0 auto 8px;
            background: var(--char-grad);
            position: relative;
            box-shadow: 0 0 15px var(--char-glow);
        }

        .char-preview::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 4px;
        }

        .char-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--char-color);
        }

        /* ====== انتخاب مرحله ====== */
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            max-width: 500px;
            width: 100%;
        }

        .stage-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .stage-card:hover {
            transform: translateY(-4px);
            border-color: #00d9ff;
        }

        .stage-number {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .stage-name {
            font-size: 11px;
            color: #8b949e;
            margin-top: 6px;
        }

        /* ====== آمار نهایی ====== */
        .final-stats {
            display: flex;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .final-stat-value {
            font-size: 38px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .final-stat-label {
            font-size: 12px;
            color: #8b949e;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .new-record {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #05080d;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ====== Button row ====== */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        /* ====== Stage transition ====== */
        .stage-transition {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 13, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .stage-transition.active {
            opacity: 1;
            pointer-events: auto;
        }

        .stage-transition-number {
            font-size: 100px;
            font-weight: 900;
            background: linear-gradient(135deg, #00d9ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            animation: zoomIn 0.6s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .stage-transition-name {
            font-size: 22px;
            color: #e6edf3;
            font-weight: 700;
            margin-top: 10px;
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ====== Power-up indicator ====== */
        .powerup-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .powerup-icon {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #00d9ff;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            animation: pulseGlow 1s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 217, 255, 0.5); }
            50% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.9); }
        }

        /* ====== دکمه تغییر شخصیت داخل بازی ====== */
        .char-change-btn {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e6edf3;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            z-index: 10;
            font-family: inherit;
            transition: all 0.3s;
            display: none;
        }

        .char-change-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
            color: #00d9ff;
        }

        .char-change-btn.visible {
            display: block;
        }

        /* ====== Credit ====== */
        .credit {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #4b5563;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            z-index: 5;
        }

        .credit a {
            text-decoration: none;
            transition: all 0.3s;
        }

        .credit span {
            color: #00d9ff;
            opacity: 0.6;
            transition: all 0.3s;
        }

        .credit a:hover span {
            opacity: 1;
            text-decoration: underline;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.8);
        }

        /* ====== Mobile ====== */
        @media (max-width: 600px) {
            .overlay-title { font-size: 28px; }
            .overlay-icon { font-size: 50px; }
            .overlay-subtitle { font-size: 13px; }
            .hud-value { font-size: 18px; }
            .hud-box { padding: 6px 10px; min-width: 60px; }
            .hud-label { font-size: 9px; }
            .char-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stage-transition-number { font-size: 70px; }
            .final-stat-value { font-size: 28px; }
            .play-btn { padding: 13px 30px; font-size: 15px; }
            .char-preview { width: 36px; height: 36px; }
            .lang-card { padding: 20px 30px; min-width: 110px; }
            .lang-card-icon { font-size: 34px; }
            .lang-card-name { font-size: 14px; }
            .credit { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud">
            <div class="hud-box">
                <div class="hud-label" id="labelScore">امتیاز</div>
                <div class="hud-value" id="scoreDisplay">0</div>
            </div>
            <div class="hud-box hud-stage">
                <div class="hud-label"><span id="labelStage">مرحله</span> <span id="stageHudName">—</span></div>
                <div class="stage-progress"><div class="stage-progress-fill" id="stageProgress"></div></div>
            </div>
            <div class="hud-box">
                <div class="hud-label" id="labelBest">رکورد</div>
                <div class="hud-value" id="bestDisplay">0</div>
            </div>
        </div>

        <!-- دکمه تغییر شخصیت -->
        <button class="char-change-btn" id="charChangeBtn" onclick="showCharacterSelect(true)">🎭 <span id="charChangeBtnLabel">تغییر شخصیت</span></button>

        <!-- Power-up -->
        <div class="powerup-bar" id="powerupBar"></div>

        <!-- Stage Transition -->
        <div class="stage-transition" id="stageTransition">
            <div class="stage-transition-number" id="transitionNum">1</div>
            <div class="stage-transition-name" id="transitionName">شروع</div>
        </div>

        <!-- ============ انتخاب زبان ============ -->
        <div class="overlay" id="langOverlay">
            <div class="overlay-icon">🌍</div>
            <h1 class="overlay-title">Gravity Flip Pro</h1>
            <p class="overlay-subtitle">زبان خود را انتخاب کنید<br>Choose your language</p>
            <div class="lang-select-row">
                <div class="lang-card" onclick="selectLanguage('fa')">
                    <div class="lang-card-icon">🇮🇷</div>
                    <div class="lang-card-name">فارسی</div>
                </div>
                <div class="lang-card" onclick="selectLanguage('en')">
                    <div class="lang-card-icon">🇬🇧</div>
                    <div class="lang-card-name">English</div>
                </div>
            </div>
        </div>

        <!-- ============ منوی اصلی ============ -->
        <div class="overlay hidden" id="menuOverlay">
            <div class="overlay-icon">🎮</div>
            <h1 class="overlay-title">Gravity Flip Pro</h1>
            <p class="overlay-subtitle" id="menuSubtitle"></p>
            <button class="play-btn" onclick="showCharacterSelect()" id="btnStart"></button>
        </div>

        <!-- ============ انتخاب شخصیت ============ -->
        <div class="overlay hidden" id="charOverlay">
            <div class="overlay-icon">🎭</div>
            <h1 class="overlay-title" id="charTitle"></h1>
            <p class="overlay-subtitle" id="charSubtitle"></p>

            <div class="char-grid" id="charGrid"></div>

            <div class="btn-row">
                <button class="play-btn secondary" onclick="backFromChar()" id="btnBackFromChar">←</button>
                <button class="play-btn" onclick="confirmChar()" id="btnConfirmChar"></button>
            </div>
        </div>

        <!-- ============ انتخاب مرحله ============ -->
        <div class="overlay hidden" id="stageOverlay">
            <div class="overlay-icon">🗺️</div>
            <h1 class="overlay-title" id="stageTitle"></h1>
            <p class="overlay-subtitle" id="stageSubtitle"></p>

            <div class="stages-grid" id="stagesGrid"></div>

            <div class="btn-row">
                <button class="play-btn secondary" onclick="showCharacterSelect()" id="btnBackToChar">←</button>
            </div>
        </div>

        <!-- ============ پایان بازی ============ -->
        <div class="overlay hidden" id="gameOverOverlay">
            <div class="overlay-icon">💥</div>
            <h1 class="overlay-title" id="gameOverTitle"></h1>
            <div id="recordBadge"></div>
            <div class="final-stats">
                <div>
                    <div class="final-stat-value" id="finalScore">0</div>
                    <div class="final-stat-label" id="lblFinalScore"></div>
                </div>
                <div>
                    <div class="final-stat-value" id="finalStage">1</div>
                    <div class="final-stat-label" id="lblFinalStage"></div>
                </div>
                <div>
                    <div class="final-stat-value" id="finalBest">0</div>
                    <div class="final-stat-label" id="lblFinalBest"></div>
                </div>
            </div>
            <div class="btn-row">
                <button class="play-btn" onclick="restartStage()" id="btnRetry"></button>
                <button class="play-btn secondary" onclick="showStageSelect()" id="btnChooseStage"></button>
            </div>
        </div>

        <!-- ============ پیروزی ============ -->
        <div class="overlay hidden" id="winOverlay">
            <div class="overlay-icon">🏆</div>
            <h1 class="overlay-title" id="winTitle"></h1>
            <p class="overlay-subtitle" id="winSubtitle"></p>
            <div class="final-stats">
                <div>
                    <div class="final-stat-value" id="winScore">0</div>
                    <div class="final-stat-label" id="lblWinScore"></div>
                </div>
                <div>
                    <div class="final-stat-value">۶/۶</div>
                    <div class="final-stat-label" id="lblWinStages"></div>
                </div>
            </div>
            <div class="btn-row">
                <button class="play-btn" onclick="showMenu()" id="btnWinMenu"></button>
            </div>
        </div>
    </div>

    <div class="credit">Create by <a href="https://amirhosseinsefrvayek-glitch.github.io/Myresume/" target="_blank"><span>Amirhossein Hosseinzadeh</span></a></div>

        let currentLang = localStorage.getItem('gfLang') || null;

        // ========== Size ==========

        function resizeCanvas() {

            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;

        function confirmChar() {}
        function backFromChar() {}

        function showStageSelect() {
            gameState = STATE.MENU;
            hideAllOverlays();
            buildStageGrid();
            document.getElementById('stageOverlay').classList.remove('hidden');
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
        }

        function buildCharGrid() {
            const grid = document.getElementById('charGrid');
            grid.innerHTML = '';
            CHARACTERS.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'char-card' + (i === selectedCharIndex ? ' selected' : '');
                card.style.setProperty('--char-color', c.color1);
                card.style.setProperty('--char-glow', c.glow);
                card.style.setProperty('--char-grad', `linear-gradient(135deg, ${c.color1}, ${c.color2})`);
                card.innerHTML = `
                    <div class="char-preview"></div>
                    <div class="char-name">${c.name[currentLang]}</div>
                `;
                card.onclick = () => {
                    selectedCharIndex = i;
                    localStorage.setItem('gfChar', i);
                    buildCharGrid();
                };
                grid.appendChild(card);
            });
        }

        function buildStageGrid() {
            const grid = document.getElementById('stagesGrid');
            grid.innerHTML = '';
            const t = T[currentLang];
            STAGES.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = 'stage-card';
                card.innerHTML = `
                    <div class="stage-number">${s.id}</div>
                    <div class="stage-name">${t.stageNames[i]}</div>
                `;
                card.onclick = () => startStage(i);
                grid.appendChild(card);
            });

        // ========== Start Stage ==========
        function startStage(stageIndex) {
            currentStageIndex = stageIndex;
            hideAllOverlays();
            document.getElementById('charChangeBtn').classList.remove('visible');
            showStageTransition(STAGES[stageIndex]);
        }

        function showStageTransition(stage) {
            const trans = document.getElementById('stageTransition');
            document.getElementById('transitionNum').textContent = stage.id;
            document.getElementById('transitionName').textContent = T[currentLang].stageNames[stage.id - 1];
            trans.classList.add('active');

            setTimeout(() => {
                trans.classList.remove('active');
                initStage(stage);
                setTimeout(() => {
                    gameState = STATE.PLAYING;
                    document.getElementById('charChangeBtn').classList.add('visible');
                }, 100);
            }, 1500);
        }

        function initStage(stage) {
            obstacles = [];
            particles = [];
            powerups = [];
            activePowerup = null;
            powerupTimer = 0;
            obstacleSpawnTimer = 0;
            score = 0;
            frameCount = 0;
            gameSpeed = stage.baseSpeed;

            player.y = H / 2;
            player.vy = 0;
            player.isGravityUp = false;
            player.rotation = 0;
            player.targetRotation = 0;
            player.trail = [];

            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('bestDisplay').textContent = bestScore;
            document.getElementById('stageHudName').textContent = stage.id;
            document.getElementById('stageProgress').style.width = '0%';
            document.getElementById('powerupBar').innerHTML = '';
        }

        function restartStage() {
            startStage(currentStageIndex);
        }

        // ========== Flip ==========
        function flip() {
            if (gameState !== STATE.PLAYING) return;
            player.isGravityUp = !player.isGravityUp;
            player.vy = player.isGravityUp ? -player.jumpForce : player.jumpForce;
            player.targetRotation += Math.PI;
            createParticles(player.x + player.size / 2, player.y + player.size / 2, CHARACTERS[selectedCharIndex].color1, 8, 4);
        }

        // ========== Input ==========
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
                if (gameState === STATE.PLAYING) flip();
            }
        });

        canvas.addEventListener('mousedown', () => {
            if (gameState === STATE.PLAYING) flip();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === STATE.PLAYING) flip();
        }, { passive: false });

        // ========== Particles ==========
        function createParticles(x, y, color, count, sizeMin = 3) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: rand(-8, 8),
                    vy: rand(-8, 8),
                    life: 1,
                    color,
                    size: rand(sizeMin, sizeMin + 4)
                });
            }
        }

        // ========== Spawn Obstacle ==========
        function spawnObstacle() {
            const stage = STAGES[currentStageIndex];
            const type = choose(stage.obstacleTypes);

            let obs = {
                x: W + 20, width: 30, height: 60, y: 0,
                passed: false, type: type, color: '#7c3aed',
                baseY: 0, phase: Math.random() * Math.PI * 2,
                moveAmp: 0, moveSpeed: 0
            };

            const usableHeight = H - GROUND_HEIGHT * 2;

            if (type === 'simple') {
                obs.height = rand(usableHeight * 0.2, usableHeight * 0.4);
                obs.y = Math.random() > 0.5 ? 0 : H - GROUND_HEIGHT - obs.height;
                obs.color = '#7c3aed';
            } else if (type === 'tall') {
                obs.height = rand(usableHeight * 0.4, usableHeight * 0.55);
                obs.y = Math.random() > 0.5 ? 0 : H - GROUND_HEIGHT - obs.height;
                obs.width = 25;
                obs.color = '#00d9ff';
            } else if (type === 'moving') {
                obs.height = rand(usableHeight * 0.18, usableHeight * 0.3);
                obs.baseY = H / 2 - obs.height / 2;
                obs.y = obs.baseY;
                obs.moveAmp = rand(50, 100);
                obs.moveSpeed = rand(0.015, 0.03);
                obs.color = '#fbbf24';
            } else if (type === 'double') {
                obs.height = rand(usableHeight * 0.2, usableHeight * 0.3);
                obs.y = 0;
                obs.color = '#ef4444';
                obstacles.push({
                    x: W + 20, width: 30, height: obs.height,
                    y: H - GROUND_HEIGHT - obs.height,
                    passed: false, type: 'double_bottom', color: '#ef4444',
                    baseY: 0, phase: 0, moveAmp: 0, moveSpeed: 0
                });
            } else if (type === 'spinning') {
                obs.height = 30;
                obs.width = 30;
                obs.y = rand(50, H - GROUND_HEIGHT - 80);
                obs.color = '#f87171';
                obs.rotation = 0;
                obs.rotateSpeed = 0.06;
            }

            obstacles.push(obs);
        }

        function spawnPowerup() {
            const types = ['shield', 'slow', 'double'];
            const type = choose(types);
            powerups.push({
                x: W + 20, y: rand(80, H - GROUND_HEIGHT - 80),
                size: 30, type: type, rotation: 0, bob: 0
            });
        }

        // ========== Update ==========
        function update() {
            if (gameState !== STATE.PLAYING) return;

            const stage = STAGES[currentStageIndex];

            frameCount++;
            obstacleSpawnTimer++;
            powerupTimer++;

            gameSpeed = stage.baseSpeed + frameCount * stage.speedIncrease;

            let speedMult = 1;
            if (activePowerup && activePowerup.type === 'slow') {
                speedMult = 0.55;
            }

            const effectiveSpeed = gameSpeed * speedMult;

            score = Math.floor(frameCount / 5);
            document.getElementById('scoreDisplay').textContent = score;

            const progress = Math.min(100, (score / stage.goal) * 100);
            document.getElementById('stageProgress').style.width = progress + '%';

            if (activePowerup && Date.now() > activePowerup.until) {
                activePowerup = null;
                updatePowerupBar();
            }

            const dynamicInterval = Math.max(60, stage.spawnInterval - gameSpeed * 3);
            if (obstacleSpawnTimer >= dynamicInterval) {
                obstacleSpawnTimer = 0;
                spawnObstacle();
            }

            if (stage.powerups && powerupTimer >= 500 && Math.random() > 0.6) {
                powerupTimer = 0;
                spawnPowerup();
            }

            // فیزیک
            const gravityDir = player.isGravityUp ? -1 : 1;
            player.vy += player.gravity * gravityDir;
            player.y += player.vy;

            const ceiling = 0;
            const floor = H - GROUND_HEIGHT - player.size;

            if (player.y <= ceiling) {
                player.y = ceiling;
                if (player.vy < 0) player.vy = 0;
            }
            if (player.y >= floor) {
                player.y = floor;
                if (player.vy > 0) player.vy = 0;
            }

            player.rotation += (player.targetRotation - player.rotation) * 0.18;

            player.trail.push({ x: player.x, y: player.y, life: 1 });
            if (player.trail.length > 8) player.trail.shift();
            player.trail.forEach(t => t.life -= 0.12);

            // موانع
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= effectiveSpeed;

                if (obs.type === 'moving') {
                    obs.phase += obs.moveSpeed;
                    obs.y = obs.baseY + Math.sin(obs.phase) * obs.moveAmp;
                }
                if (obs.type === 'spinning') {
                    obs.rotation = (obs.rotation || 0) + obs.rotateSpeed;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }

                if (checkCollision(player, obs)) {
                    if (activePowerup && activePowerup.type === 'shield') {
                        activePowerup = null;
                        updatePowerupBar();
                        createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#10b981', 20);
                        obstacles.splice(i, 1);
                        continue;
                    }
                    createParticles(player.x + player.size / 2, player.y + player.size / 2, CHARACTERS[selectedCharIndex].color1, 30, 4);
                    gameOver();
                    return;
                }
            }

            // power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.x -= effectiveSpeed;
                pu.rotation += 0.05;
                pu.bob += 0.1;

                if (pu.x + pu.size < 0) {
                    powerups.splice(i, 1);
                    continue;
                }

                if (rectCircleCollision(player, pu)) {
                    activatePowerup(pu.type);
                    createParticles(pu.x + pu.size / 2, pu.y + pu.size / 2, '#10b981', 15);
                    powerups.splice(i, 1);
                }
            }

            // ذرات
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.vx *= 0.98;
                p.life -= 0.025;
                p.size *= 0.98;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (score >= stage.goal) {
                stageComplete();
            }
        }

        function rectCircleCollision(rect, circle) {
            const cx = circle.x + circle.size / 2;
            const cy = circle.y + circle.size / 2;
            const rx = rect.x + rect.size / 2;
            const ry = rect.y + rect.size / 2;
            const dx = cx - rx, dy = cy - ry;
            return Math.sqrt(dx * dx + dy * dy) < (rect.size / 2 + circle.size / 2);
        }

        function activatePowerup(type) {
            const durations = { shield: 8000, slow: 5000, double: 10000 };
            activePowerup = { type, until: Date.now() + durations[type] };
            updatePowerupBar();
        }

        function updatePowerupBar() {
            const bar = document.getElementById('powerupBar');
            if (!activePowerup) { bar.innerHTML = ''; return; }
            const icons = { shield: '🛡️', slow: '⏱️', double: '✨' };
            bar.innerHTML = `<div class="powerup-icon">${icons[activePowerup.type]}</div>`;
        }

        function checkCollision(p, obs) {
            return (
                p.x < obs.x + obs.width &&
                p.x + p.size > obs.x &&
                p.y < obs.y + obs.height &&
                p.y + p.size > obs.y
            );
        }

        // ========== Stage Complete ==========
        function stageComplete() {
            gameState = STATE.MENU;
            const stage = STAGES[currentStageIndex];

            let isNewRecord = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('gfBest', bestScore);
                isNewRecord = true;
            }

            if (stage.id === STAGES.length) {
                showWin();
                return;
            }

            const nextStage = STAGES[currentStageIndex + 1];
            const trans = document.getElementById('stageTransition');
            trans.innerHTML = `
                <div class="overlay-icon" style="font-size: 60px;">🎉</div>
                <div class="stage-transition-name" style="font-size: 26px; color: #10b981; margin-bottom: 10px;">${currentLang === 'fa' ? 'مرحله ' + stage.id + ' تموم شد!' : 'Stage ' + stage.id + ' Complete!'}</div>
                <div style="color: #8b949e; margin-bottom: 20px;">${currentLang === 'fa' ? 'امتیاز' : 'Score'}: <b style="color: #00d9ff;">${score}</b></div>
                <div class="stage-transition-number">${nextStage.id}</div>
                <div class="stage-transition-name">${T[currentLang].stageNames[nextStage.id - 1]}</div>
            `;
            trans.classList.add('active');

            setTimeout(() => {
                trans.classList.remove('active');
                currentStageIndex++;
                initStage(STAGES[currentStageIndex]);
                setTimeout(() => {
                    gameState = STATE.PLAYING;
                    document.getElementById('charChangeBtn').classList.add('visible');
                }, 100);
            }, 2200);
        }

        function showWin() {
            hideAllOverlays();
            document.getElementById('winScore').textContent = score;
            document.getElementById('winOverlay').classList.remove('hidden');
            gameState = STATE.WIN;
        }

        // ========== Game Over ==========
        function gameOver() {
            gameState = STATE.GAMEOVER;
            let isNewRecord = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('gfBest', bestScore);
                isNewRecord = true;
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalStage').textContent = STAGES[currentStageIndex].id;
            document.getElementById('finalBest').textContent = bestScore;

            const badge = document.getElementById('recordBadge');
            badge.innerHTML = isNewRecord ? `<div class="new-record">${T[currentLang].newRecord}</div>` : '';

            hideAllOverlays();
            document.getElementById('charChangeBtn').classList.remove('visible');
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        // ========== Render ==========
        function render() {
            const stage = STAGES[currentStageIndex] || STAGES[0];
            const char = CHARACTERS[selectedCharIndex];

            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, stage.bgTop);
            bgGrad.addColorStop(0.5, stage.bgBottom);
            bgGrad.addColorStop(1, stage.bgTop);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(0, 217, 255, 0.15)';
            for (let i = 0; i < 50; i++) {
                const sx = (i * 137 + frameCount * 0.3) % W;
                const sy = (i * 89) % H;
                ctx.fillRect(sx, sy, 2, 2);
            }

            const ceilGrad = ctx.createLinearGradient(0, 0, 0, 12);
            ceilGrad.addColorStop(0, '#7c3aed');
            ceilGrad.addColorStop(1, 'rgba(124, 58, 237, 0)');
            ctx.fillStyle = ceilGrad;
            ctx.fillRect(0, 0, W, 12);

            const groundGrad = ctx.createLinearGradient(0, H - GROUND_HEIGHT, 0, H);
            groundGrad.addColorStop(0, 'rgba(0, 217, 255, 0.3)');
            groundGrad.addColorStop(1, '#00d9ff');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
            ctx.fillStyle = '#00d9ff';
            ctx.fillRect(0, H - GROUND_HEIGHT - 2, W, 2);

            obstacles.forEach(obs => {
                ctx.save();
                if (obs.type === 'spinning') {
                    ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
                    ctx.rotate(obs.rotation || 0);
                    ctx.translate(-obs.width / 2, -obs.height / 2);
                    ctx.shadowColor = obs.color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = obs.color;
                    ctx.fillRect(0, 0, obs.width, obs.height);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, obs.width, obs.height);
                } else {
                    ctx.shadowColor = obs.color;
                    ctx.shadowBlur = 18;
                    const grad = ctx.createLinearGradient(obs.x, obs.y, obs.x + obs.width, obs.y + obs.height);
                    grad.addColorStop(0, obs.color);
                    grad.addColorStop(1, shadeColor(obs.color, -40));
                    ctx.fillStyle = grad;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    if (obs.y < H / 2) {
                        ctx.fillRect(obs.x, obs.y + obs.height - 3, obs.width, 3);
                    } else {
                        ctx.fillRect(obs.x, obs.y, obs.width, 3);
                    }
                    ctx.strokeStyle = obs.color;
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                }
                ctx.restore();
            });
            ctx.shadowBlur = 0;

            powerups.forEach(pu => {
                ctx.save();
                ctx.translate(pu.x + pu.size / 2, pu.y + pu.size / 2 + Math.sin(pu.bob) * 5);
                ctx.rotate(pu.rotation);
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 25;
                ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, pu.size / 2 + 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.font = 'bold 24px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const icons = { shield: '🛡️', slow: '⏱️', double: '✨' };
                ctx.fillText(icons[pu.type], 0, 2);
                ctx.restore();
            });

            if (gameState === STATE.PLAYING) {
                player.trail.forEach((t) => {
                    if (t.life <= 0) return;
                    ctx.globalAlpha = t.life * 0.3;
                    ctx.fillStyle = char.color1;
                    const size = player.size * t.life * 0.7;
                    ctx.fillRect(t.x + (player.size - size) / 2, t.y + (player.size - size) / 2, size, size);
                });
                ctx.globalAlpha = 1;
            }

            if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate(player.rotation);

                if (activePowerup && activePowerup.type === 'shield') {
                    ctx.shadowColor = '#10b981';
                    ctx.shadowBlur = 40;
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.size / 2 + 12, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.shadowColor = char.color1;
                ctx.shadowBlur = 25;
                const playerGrad = ctx.createLinearGradient(-player.size / 2, -player.size / 2, player.size / 2, player.size / 2);
                playerGrad.addColorStop(0, char.color1);
                playerGrad.addColorStop(1, char.color2);
                ctx.fillStyle = playerGrad;

                const r = 7, s = player.size;
                ctx.beginPath();
                ctx.roundRect(-s / 2, -s / 2, s, s, r);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-s / 2 + 6, -s / 2 + 6, s - 12, s - 12, r - 2);
                ctx.stroke();

                ctx.fillStyle = char.eyeColor;
                ctx.beginPath();
                ctx.arc(-6, -4, 4, 0, Math.PI * 2);
                ctx.arc(6, -4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#05080d';
                ctx.beginPath();
                ctx.arc(-6, -3, 2, 0, Math.PI * 2);
                ctx.arc(6, -3, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = char.eyeColor;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 4, 4, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.stroke();

                ctx.restore();
                ctx.shadowBlur = 0;
            }

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // ========== Loop ==========
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ========== Init ==========
        resizeCanvas();
        player.y = H / 2;
        document.getElementById('bestDisplay').textContent = bestScore;

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        if (currentLang && T[currentLang]) {
            applyLanguage();
            hideAllOverlays();
            showMenu();
        } else {
            document.getElementById('langOverlay').classList.remove('hidden');
        }

        gameLoop();
    </script>

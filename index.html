    <script>
                // ============================================
        // STARS BACKGROUND
        // ============================================
        function createStars() {
            const layer = document.getElementById('bgLayer');
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 3) + 's';
                layer.appendChild(star);
            }
        }
        createStars();

        // ============================================
        // GAME DATA
        // ============================================
        let gameData = JSON.parse(localStorage.getItem('neonDashData') || 'null') || {
            bestScore: 0,
            coins: 0,
            ownedColors: ['cyan'],
            ownedChars: ['default'],
            equippedColor: 'cyan',
            equippedChar: 'default',
            face: { eyeStyle: 'normal', mouthStyle: 'smile', bodyColor: 'auto' },
            stageProgress: {},
            totalGames: 0
        };

        if (!gameData.face) gameData.face = { eyeStyle: 'normal', mouthStyle: 'smile', bodyColor: 'auto' };
        if (!gameData.stageProgress) gameData.stageProgress = {};

        function saveData() {
            localStorage.setItem('neonDashData', JSON.stringify(gameData));
        }

        // ============================================
        // COLORS
        // ============================================
        const COLORS = {
            cyan: { name: 'Cyan', primary: '#00f0ff', secondary: '#0099cc', price: 0 },
            purple: { name: 'Purple', primary: '#b537f2', secondary: '#7c1fa8', price: 50 },
            pink: { name: 'Pink', primary: '#ff2e97', secondary: '#cc1f77', price: 75 },
            yellow: { name: 'Gold', primary: '#ffd60a', secondary: '#ccaa00', price: 100 },
            green: { name: 'Neon Green', primary: '#06ffa5', secondary: '#00cc80', price: 150 },
            orange: { name: 'Orange', primary: '#ff8c42', secondary: '#cc6622', price: 200 },
            red: { name: 'Fire Red', primary: '#ff3860', secondary: '#cc1f44', price: 250 },
            white: { name: 'Snow', primary: '#ffffff', secondary: '#cccccc', price: 300 },
            rainbow: { name: 'Rainbow', primary: '#ff0000', secondary: '#0000ff', price: 500, isRainbow: true }
        };

        // ============================================
        // CHARS
        // ============================================
        const CHARS = {
            default: { name: 'Cube', emoji: '⬛', price: 0 },
            ghost: { name: 'Ghost', emoji: '👻', price: 100 },
            robot: { name: 'Robot', emoji: '🤖', price: 150 },
            alien: { name: 'Alien', emoji: '👽', price: 200 },
            skull: { name: 'Skull', emoji: '💀', price: 250 },
            fire: { name: 'Fire', emoji: '🔥', price: 300 },
            star: { name: 'Star', emoji: '⭐', price: 350 },
            heart: { name: 'Heart', emoji: '❤️', price: 400 },
            dragon: { name: 'Dragon', emoji: '🐉', price: 500 },
            crown: { name: 'Crown', emoji: '👑', price: 750 },
            cat: { name: 'Cat', emoji: '🐱', price: 200 },
            dog: { name: 'Dog', emoji: '🐶', price: 200 },
            panda: { name: 'Panda', emoji: '🐼', price: 250 },
            fox: { name: 'Fox', emoji: '🦊', price: 300 },
            lion: { name: 'Lion', emoji: '🦁', price: 350 },
            unicorn: { name: 'Unicorn', emoji: '🦄', price: 600 },
            wizard: { name: 'Wizard', emoji: '🧙', price: 550 },
            ninja: { name: 'Ninja', emoji: '🥷', price: 450 },
            cowboy: { name: 'Cowboy', emoji: '🤠', price: 400 },
            diamond: { name: 'Diamond', emoji: '💎', price: 1000 }
        };

        // ============================================
        // FACE
        // ============================================
        const FACE_EYES = {
            normal: { emoji: '👁️' },
            happy: { emoji: '😊' },
            angry: { emoji: '😠' },
            cool: { emoji: '😎' },
            wink: { emoji: '😉' },
            heart: { emoji: '😍' },
            star: { emoji: '🤩' },
            dead: { emoji: '😵' }
        };

        const FACE_MOUTH = {
            smile: { emoji: '😊' },
            neutral: { emoji: '😐' },
            sad: { emoji: '😢' },
            open: { emoji: '😮' },
            laugh: { emoji: '😂' },
            tongue: { emoji: '😛' },
            kiss: { emoji: '😘' },
            fire: { emoji: '🔥' }
        };

        // ============================================
        // 10 STAGES — Each with unique theme + obstacles
        // ============================================
        const STAGES = [
            {
                num: 1, name: 'FOREST', icon: '🌱',
                bg1: '#0a1a0a', bg2: '#1a3a1a',
                ground: '#06ffa5', accent: '#06ffa5',
                obstaclePatterns: ['single'],
                speed: 3.0, gap: 180,
                difficulty: 1,
                music: [261, 329, 392, 523]
            },
            {
                num: 2, name: 'OCEAN', icon: '💧',
                bg1: '#0a0a2e', bg2: '#0a1a4a',
                ground: '#00d9ff', accent: '#00d9ff',
                obstaclePatterns: ['single', 'double'],
                speed: 3.3, gap: 170,
                difficulty: 1,
                music: [293, 369, 440, 587]
            },
            {
                num: 3, name: 'BLOSSOM', icon: '🌸',
                bg1: '#2e0a1e', bg2: '#4a1a3e',
                ground: '#ff6bcb', accent: '#ff6bcb',
                obstaclePatterns: ['single', 'double', 'triangle'],
                speed: 3.6, gap: 160,
                difficulty: 2,
                music: [329, 415, 493, 659]
            },
            {
                num: 4, name: 'GALAXY', icon: '⭐',
                bg1: '#1e0a2e', bg2: '#3a0a4a',
                ground: '#b537f2', accent: '#b537f2',
                obstaclePatterns: ['single', 'triangle', 'stairs'],
                speed: 3.9, gap: 150,
                difficulty: 2,
                music: [349, 440, 523, 698]
            },
            {
                num: 5, name: 'INFERNO', icon: '🔥',
                bg1: '#2e0a0a', bg2: '#4a1a0a',
                ground: '#ff4500', accent: '#ff8c00',
                obstaclePatterns: ['single', 'double', 'stairs', 'wall'],
                speed: 4.2, gap: 140,
                difficulty: 3,
                music: [392, 493, 587, 784]
            },
            {
                num: 6, name: 'ICE', icon: '❄️',
                bg1: '#0a1e2e', bg2: '#1a3a5a',
                ground: '#a8e6ff', accent: '#ffffff',
                obstaclePatterns: ['single', 'stairs', 'wall', 'floating'],
                speed: 4.4, gap: 135,
                difficulty: 3,
                music: [415, 523, 622, 830]
            },
            {
                num: 7, name: 'DESERT', icon: '🏜️',
                bg1: '#2e1e0a', bg2: '#4a3a1a',
                ground: '#ffd60a', accent: '#ff8c42',
                obstaclePatterns: ['double', 'stairs', 'wall', 'floating'],
                speed: 4.6, gap: 130,
                difficulty: 4,
                music: [440, 554, 659, 880]
            },
            {
                num: 8, name: 'DARK FOREST', icon: '🌲',
                bg1: '#051005', bg2: '#0a1a0a',
                ground: '#10b981', accent: '#059669',
                obstaclePatterns: ['single', 'double', 'stairs', 'wall', 'floating', 'combo'],
                speed: 4.8, gap: 125,
                difficulty: 4,
                music: [466, 587, 698, 932]
            },
            {
                num: 9, name: 'HELL', icon: '💀',
                bg1: '#1a0000', bg2: '#3a0000',
                ground: '#ff0000', accent: '#ff4444',
                obstaclePatterns: ['double', 'stairs', 'wall', 'floating', 'combo'],
                speed: 5.0, gap: 120,
                difficulty: 5,
                music: [493, 622, 740, 988]
            },
            {
                num: 10, name: 'BLACK HOLE', icon: '🕳️',
                bg1: '#000000', bg2: '#1a0a1a',
                ground: '#ffffff', accent: '#b537f2',
                obstaclePatterns: ['stairs', 'wall', 'floating', 'combo'],
                speed: 5.2, gap: 115,
                difficulty: 5,
                music: [523, 659, 784, 1046]
            }
        ];

        // ============================================
        // GAME STATE
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let game = {
            running: false,
            over: false,
            paused: false,
            score: 0,
            coins: 0,
            stageIndex: 0,
            speed: 3.0,
            gravity: 0.55,
            jumpForce: -15,
            groundY: 0,
            player: { x: 100, y: 0, size: 40, vy: 0, rotation: 0, onGround: true },
            obstacles: [],
            coinItems: [],
            particles: [],
            spawnTimer: 0,
            coinSpawnTimer: 0,
            frameCount: 0,
            groundParticles: [],
            lastPattern: ''
        };

        function getStage() { return STAGES[Math.min(game.stageIndex, STAGES.length - 1)]; }

        function getCurrentColor() {
            if (gameData.face.bodyColor !== 'auto' && COLORS[gameData.face.bodyColor]) {
                return COLORS[gameData.face.bodyColor];
            }
            return COLORS[gameData.equippedColor] || COLORS.cyan;
        }

        function getCurrentChar() { return CHARS[gameData.equippedChar] || CHARS.default; }

        // ============================================
        // AUDIO
        // ============================================
        let audioCtx = null;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
            }
        }

        function playSound(freq, duration, type = 'sine', volume = 0.08) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function soundJump() { playSound(600, 0.1, 'square', 0.05); }
        function soundCoin() { playSound(1000, 0.08, 'sine', 0.08); setTimeout(() => playSound(1300, 0.08, 'sine', 0.08), 40); }
        function soundHit() { playSound(150, 0.4, 'sawtooth', 0.1); }
        function soundStage() {
            playSound(500, 0.12, 'sine', 0.08);
            setTimeout(() => playSound(700, 0.12, 'sine', 0.08), 100);
            setTimeout(() => playSound(900, 0.2, 'sine', 0.08), 200);
        }

        // Background music loop
        function startMusic() {
            stopMusic();
            const stage = getStage();
            let noteIndex = 0;
            musicInterval = setInterval(() => {
                if (!game.running || game.paused) return;
                const note = stage.music[noteIndex % stage.music.length];
                playSound(note, 0.3, 'triangle', 0.03);
                noteIndex++;
            }, 400);
        }

        function stopMusic() {
            if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
        }

        // ============================================
        // SCREENS
        // ============================================
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (id) document.getElementById(id).classList.add('active');
        }

        function showHUD(show) {
            document.getElementById('hud').style.display = show ? 'block' : 'none';
            document.getElementById('hud').classList.toggle('active', show);
        }

        // ============================================
        // MENU
        // ============================================
        function updateMenu() {
            document.getElementById('menuBest').textContent = gameData.bestScore;
            document.getElementById('menuCoins').textContent = gameData.coins;
            document.getElementById('menuChars').textContent = gameData.ownedChars.length;
            renderStagesList();
        }

        function renderStagesList() {
            const list = document.getElementById('stagesList');
            list.innerHTML = '';

            STAGES.forEach((stage, idx) => {
                const stageNum = idx + 1;
                const progress = gameData.stageProgress[stageNum] || 0;

                const row = document.createElement('div');
                row.className = 'stage-row';

                let starsHTML = '';
                for (let i = 1; i <= 5; i++) {
                    starsHTML += `<span class="diff-star ${i <= stage.difficulty ? 'filled' : ''}">★</span>`;
                }

                let percentHTML = progress >= 100
                    ? `<div class="stage-percent complete">100%</div>`
                    : `<div class="stage-percent">${progress}%</div>`;

                row.innerHTML = `
                    <div class="stage-icon">${stage.icon}</div>
                    <div class="stage-info">
                        <div class="stage-name">${stageNum}. ${stage.name}</div>
                        <div class="stage-diff">${starsHTML}</div>
                        <div class="stage-progress-bar">
                            <div class="stage-progress-bar-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    ${percentHTML}
                `;

                row.onclick = () => startGameFromStage(idx);
                list.appendChild(row);
            });
        }

        // ============================================
        // SHOP
        // ============================================
        let currentShopTab = 'colors';

        function openShop() {
            updateShopCoins();
            renderShop();
            showScreen('screenShop');
        }

        function closeShop() {
            showScreen('screenMenu');
            updateMenu();
        }

        function updateShopCoins() {
            document.getElementById('shopCoins').textContent = gameData.coins;
        }

        function switchShopTab(tab, btn) {
            currentShopTab = tab;
            document.querySelectorAll('.shop-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderShop();
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';

            if (currentShopTab === 'colors') renderColorShop(grid);
            else if (currentShopTab === 'chars') renderCharShop(grid);
            else renderFaceShop(grid);
        }

        function renderColorShop(grid) {
            Object.keys(COLORS).forEach(key => {
                const color = COLORS[key];
                const owned = gameData.ownedColors.includes(key);
                const equipped = gameData.equippedColor === key && gameData.face.bodyColor === 'auto';

                const item = document.createElement('div');
                item.className = 'shop-item';
                if (owned) item.classList.add('owned');
                if (equipped) item.classList.add('equipped');

                const previewStyle = color.isRainbow
                    ? 'background: linear-gradient(135deg, #ff0000, #ff8c42, #ffd60a, #06ffa5, #00f0ff, #b537f2, #ff2e97);'
                    : `background: linear-gradient(135deg, ${color.primary}, ${color.secondary}); box-shadow: 0 0 25px ${color.primary};`;

                let statusHTML = equipped
                    ? `<div class="shop-item-equipped">✓ EQUIPPED</div>`
                    : owned
                    ? `<div class="shop-item-owned">✓ OWNED</div>`
                    : `<div class="shop-item-price">🪙 ${color.price}</div>`;

                item.innerHTML = `
                    <div class="shop-item-preview" style="${previewStyle}"></div>
                    <div class="shop-item-name">${color.name}</div>
                    ${statusHTML}
                `;
                item.onclick = () => handleColorClick(key);
                grid.appendChild(item);
            });
        }

        function renderCharShop(grid) {
            Object.keys(CHARS).forEach(key => {
                const char = CHARS[key];
                const owned = gameData.ownedChars.includes(key);
                const equipped = gameData.equippedChar === key;

                const item = document.createElement('div');
                item.className = 'shop-item';
                if (owned) item.classList.add('owned');
                if (equipped) item.classList.add('equipped');

                let statusHTML = equipped
                    ? `<div class="shop-item-equipped">✓ EQUIPPED</div>`
                    : owned
                    ? `<div class="shop-item-owned">✓ OWNED</div>`
                    : `<div class="shop-item-price">🪙 ${char.price}</div>`;

                item.innerHTML = `
                    <div class="shop-item-preview" style="font-size: 44px; background: rgba(255,255,255,0.04);">${char.emoji}</div>
                    <div class="shop-item-name">${char.name}</div>
                    ${statusHTML}
                `;
                item.onclick = () => handleCharClick(key);
                grid.appendChild(item);
            });
        }

        function renderFaceShop(grid) {
            grid.innerHTML = '';

            const eyeSection = document.createElement('div');
            eyeSection.className = 'face-section';
            eyeSection.style.gridColumn = '1 / -1';
            let eyesHTML = `<div class="face-section-title">Eyes</div><div class="face-options">`;
            Object.keys(FACE_EYES).forEach(key => {
                const selected = gameData.face.eyeStyle === key ? 'selected' : '';
                eyesHTML += `<div class="face-option ${selected}" onclick="setFaceEye('${key}')">${FACE_EYES[key].emoji}</div>`;
            });
            eyesHTML += '</div>';
            eyeSection.innerHTML = eyesHTML;
            grid.appendChild(eyeSection);

            const mouthSection = document.createElement('div');
            mouthSection.className = 'face-section';
            mouthSection.style.gridColumn = '1 / -1';
            let mouthHTML = `<div class="face-section-title">Mouth</div><div class="face-options">`;
            Object.keys(FACE_MOUTH).forEach(key => {
                const selected = gameData.face.mouthStyle === key ? 'selected' : '';
                mouthHTML += `<div class="face-option ${selected}" onclick="setFaceMouth('${key}')">${FACE_MOUTH[key].emoji}</div>`;
            });
            mouthHTML += '</div>';
            mouthSection.innerHTML = mouthHTML;
            grid.appendChild(mouthSection);

            const colorSection = document.createElement('div');
            colorSection.className = 'face-section';
            colorSection.style.gridColumn = '1 / -1';
            let colorHTML = `<div class="face-section-title">Body Color</div><div class="face-options">`;
            const autoSelected = gameData.face.bodyColor === 'auto' ? 'selected' : '';
            colorHTML += `<div class="face-option ${autoSelected}" onclick="setFaceColor('auto')" style="background: linear-gradient(135deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff);"></div>`;
            gameData.ownedColors.forEach(cKey => {
                const c = COLORS[cKey];
                const selected = gameData.face.bodyColor === cKey ? 'selected' : '';
                const style = c.isRainbow
                    ? 'background: linear-gradient(135deg, #ff0000, #06ffa5, #00f0ff, #b537f2, #ff2e97);'
                    : `background: ${c.primary};`;
                colorHTML += `<div class="face-option ${selected}" onclick="setFaceColor('${cKey}')" style="${style}"></div>`;
            });
            colorHTML += '</div>';
            colorSection.innerHTML = colorHTML;
            grid.appendChild(colorSection);
        }

        function setFaceEye(key) { gameData.face.eyeStyle = key; saveData(); renderShop(); playSound(800, 0.06, 'sine', 0.08); }
        function setFaceMouth(key) { gameData.face.mouthStyle = key; saveData(); renderShop(); playSound(800, 0.06, 'sine', 0.08); }
        function setFaceColor(key) { gameData.face.bodyColor = key; saveData(); renderShop(); playSound(800, 0.06, 'sine', 0.08); }

        function handleColorClick(key) {
            const color = COLORS[key];
            const owned = gameData.ownedColors.includes(key);

            if (owned) {
                gameData.equippedColor = key;
                gameData.face.bodyColor = 'auto';
                saveData();
                renderShop();
                playSound(800, 0.08, 'sine', 0.08);
            } else if (gameData.coins >= color.price) {
                gameData.coins -= color.price;
                gameData.ownedColors.push(key);
                gameData.equippedColor = key;
                gameData.face.bodyColor = 'auto';
                saveData();
                updateShopCoins();
                renderShop();
                playSound(900, 0.1, 'sine', 0.08);
            } else {
                playSound(200, 0.2, 'sawtooth', 0.08);
            }
        }

        function handleCharClick(key) {
            const char = CHARS[key];
            const owned = gameData.ownedChars.includes(key);

            if (owned) {
                if (gameData.equippedChar === key) return;
                gameData.equippedChar = key;
                saveData();
                renderShop();
                playSound(800, 0.08, 'sine', 0.08);
            } else if (gameData.coins >= char.price) {
                gameData.coins -= char.price;
                gameData.ownedChars.push(key);
                gameData.equippedChar = key;
                saveData();
                updateShopCoins();
                renderShop();
                playSound(900, 0.1, 'sine', 0.08);
            } else {
                playSound(200, 0.2, 'sawtooth', 0.08);
            }
        }

        // ============================================
        // GAME START
        // ============================================
        function startGame() { startGameFromStage(0); }

        function startGameFromStage(stageIdx) {
            initAudio();
            showScreen(null);
            showHUD(true);

            game.running = true;
            game.over = false;
            game.paused = false;
            game.score = 0;
            game.coins = 0;
            game.stageIndex = stageIdx;
            game.obstacles = [];
            game.coinItems = [];
            game.particles = [];
            game.spawnTimer = 0;
            game.coinSpawnTimer = 0;
            game.frameCount = 0;
            game.groundParticles = [];
            game.lastPattern = '';

            const stage = getStage();
            game.speed = stage.speed;

            game.groundY = H - 80;
            game.player.x = 100;
            game.player.y = game.groundY - game.player.size;
            game.player.vy = 0;
            game.player.rotation = 0;
            game.player.onGround = true;

            updateHUD();
            startMusic();
            gameLoop();
        }

        function gameLoop() {
            if (!game.running) return;
            if (!game.paused) update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (game.over) return;
            game.frameCount++;

            // Stage progression: each stage = 60 points
            const newStageIdx = Math.min(Math.floor(game.score / 60), STAGES.length - 1);
            if (newStageIdx !== game.stageIndex) {
                // Complete current stage
                const completedStageNum = game.stageIndex + 1;
                gameData.stageProgress[completedStageNum] = 100;
                saveData();

                game.stageIndex = newStageIdx;
                const stage = getStage();
                game.speed = stage.speed;
                onStageChange(stage);
            }

            // Update current stage progress
            const stageNum = game.stageIndex + 1;
            const stageStartScore = game.stageIndex * 60;
            const currentProgress = Math.min(Math.floor(((game.score - stageStartScore) / 60) * 100), 100);
            if (currentProgress > (gameData.stageProgress[stageNum] || 0)) {
                gameData.stageProgress[stageNum] = currentProgress;
            }

            updatePlayer();
            updateObstacles();
            updateCoins();
            updateParticles();

            const stage = getStage();

            game.spawnTimer++;
            if (game.spawnTimer >= stage.gap) {
                game.spawnTimer = 0;
                spawnObstaclePattern();
            }

            game.coinSpawnTimer++;
            if (game.coinSpawnTimer >= 70) {
                game.coinSpawnTimer = 0;
                spawnCoin();
            }

            if (game.frameCount % 6 === 0) {
                game.score++;
                updateHUD();
            }

            if (game.frameCount % 3 === 0) {
                game.groundParticles.push({ x: W, y: game.groundY, life: 1, speed: game.speed });
            }
            game.groundParticles.forEach((p, i) => {
                p.x -= p.speed;
                p.life -= 0.02;
                if (p.life <= 0 || p.x < -10) game.groundParticles.splice(i, 1);
            });
        }

        function updatePlayer() {
            const p = game.player;
            p.vy += game.gravity;
            p.y += p.vy;

            if (p.y + p.size >= game.groundY) {
                p.y = game.groundY - p.size;
                p.vy = 0;
                p.onGround = true;
                p.rotation *= 0.9;
            } else {
                p.onGround = false;
                p.rotation += 0.1;
            }
        }

        function updateObstacles() {
            for (let i = game.obstacles.length - 1; i >= 0; i--) {
                const obs = game.obstacles[i];
                obs.x -= game.speed;

                if (obs.rotating) obs.rotation = (obs.rotation || 0) + 0.05;

                if (checkCollision(game.player, obs)) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.width < -100) game.obstacles.splice(i, 1);
            }
        }

        function updateCoins() {
            for (let i = game.coinItems.length - 1; i >= 0; i--) {
                const coin = game.coinItems[i];
                coin.x -= game.speed;
                coin.bob += 0.1;

                if (checkCoinCollision(game.player, coin)) {
                    game.coins++;
                    gameData.coins++;
                    updateHUD();
                    soundCoin();

                    for (let j = 0; j < 8; j++) {
                        game.particles.push({
                            x: coin.x + coin.size / 2,
                            y: coin.y + coin.size / 2,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 1,
                            color: '#ffd60a',
                            size: 3
                        });
                    }
                    game.coinItems.splice(i, 1);
                } else if (coin.x + coin.size < -100) {
                    game.coinItems.splice(i, 1);
                }
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
        }

        // ============================================
        // OBSTACLE PATTERNS
        // ============================================
        function spawnObstaclePattern() {
            const stage = getStage();
            const patterns = stage.obstaclePatterns;

            // Pick a different pattern than last time
            let pattern = patterns[Math.floor(Math.random() * patterns.length)];
            if (patterns.length > 1) {
                let tries = 0;
                while (pattern === game.lastPattern && tries < 5) {
                    pattern = patterns[Math.floor(Math.random() * patterns.length)];
                    tries++;
                }
            }
            game.lastPattern = pattern;

            const startX = W + 40;

            switch (pattern) {
                case 'single':
                    spawnSingle(startX);
                    break;
                case 'double':
                    spawnDouble(startX);
                    break;
                case 'triangle':
                    spawnTriangle(startX);
                    break;
                case 'stairs':
                    spawnStairs(startX);
                    break;
                case 'wall':
                    spawnWall(startX);
                    break;
                case 'floating':
                    spawnFloating(startX);
                    break;
                case 'combo':
                    spawnCombo(startX);
                    break;
            }
        }

        // Pattern 1: Single box
        function spawnSingle(x) {
            game.obstacles.push({
                x: x, y: game.groundY - 40,
                width: 40, height: 40, type: 'box'
            });
        }

        // Pattern 2: Two boxes with gap (jump between)
        function spawnDouble(x) {
            game.obstacles.push({
                x: x, y: game.groundY - 40,
                width: 45, height: 40, type: 'box'
            });
            game.obstacles.push({
                x: x + 80, y: game.groundY - 40,
                width: 45, height: 40, type: 'box'
            });
        }

        // Pattern 3: Triangle (must jump over)
        function spawnTriangle(x) {
            game.obstacles.push({
                x: x, y: game.groundY - 50,
                width: 45, height: 50, type: 'triangle'
            });
        }

        // Pattern 4: Stairs (getting taller)
        function spawnStairs(x) {
            game.obstacles.push({ x: x, y: game.groundY - 35, width: 40, height: 35, type: 'box' });
            game.obstacles.push({ x: x + 60, y: game.groundY - 60, width: 40, height: 60, type: 'box' });
            game.obstacles.push({ x: x + 120, y: game.groundY - 85, width: 40, height: 85, type: 'box' });
        }

        // Pattern 5: Tall wall (big jump)
        function spawnWall(x) {
            game.obstacles.push({
                x: x, y: game.groundY - 90,
                width: 30, height: 90, type: 'box'
            });
        }

        // Pattern 6: Floating obstacles (in air, must run under or jump over)
        function spawnFloating(x) {
            game.obstacles.push({
                x: x, y: game.groundY - 130,
                width: 60, height: 30, type: 'floating'
            });
            // And a box on the ground
            game.obstacles.push({
                x: x + 140, y: game.groundY - 40,
                width: 40, height: 40, type: 'box'
            });
        }

        // Pattern 7: Combo (box + triangle + box)
        function spawnCombo(x) {
            game.obstacles.push({ x: x, y: game.groundY - 40, width: 40, height: 40, type: 'box' });
            game.obstacles.push({ x: x + 80, y: game.groundY - 45, width: 40, height: 45, type: 'triangle' });
            game.obstacles.push({ x: x + 160, y: game.groundY - 40, width: 40, height: 40, type: 'box' });
        }

        function spawnCoin() {
            const tooClose = game.obstacles.some(o => o.x > W - 150);
            if (tooClose) return;

            const patterns = [
                [{ x: W + 40, y: game.groundY - 150 }],
                [
                    { x: W + 40, y: game.groundY - 120 },
                    { x: W + 90, y: game.groundY - 120 },
                    { x: W + 140, y: game.groundY - 120 }
                ],
                [
                    { x: W + 40, y: game.groundY - 80 },
                    { x: W + 80, y: game.groundY - 150 },
                    { x: W + 120, y: game.groundY - 80 }
                ]
            ];

            const pattern = patterns[Math.floor(Math.random() * patterns.length)];
            pattern.forEach(pos => {
                game.coinItems.push({
                    x: pos.x, y: pos.y, size: 30,
                    bob: Math.random() * Math.PI * 2
                });
            });
        }

        function checkCollision(player, obs) {
            const px = player.x + 6;
            const py = player.y + 6;
            const ps = player.size - 12;
            return px < obs.x + obs.width && px + ps > obs.x && py < obs.y + obs.height && py + ps > obs.y;
        }

        function checkCoinCollision(player, coin) {
            const pcx = player.x + player.size / 2;
            const pcy = player.y + player.size / 2;
            const ccx = coin.x + coin.size / 2;
            const ccy = coin.y + coin.size / 2;
            const dx = pcx - ccx;
            const dy = pcy - ccy;
            return Math.sqrt(dx * dx + dy * dy) < (player.size / 2 + coin.size / 2);
        }

        function jump() {
            if (!game.running || game.over || game.paused) return;
            if (game.player.onGround) {
                game.player.vy = game.jumpForce;
                game.player.onGround = false;
                soundJump();

                for (let i = 0; i < 6; i++) {
                    game.particles.push({
                        x: game.player.x + game.player.size / 2,
                        y: game.player.y + game.player.size,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3,
                        life: 1,
                        color: getCurrentColor().primary,
                        size: 3
                    });
                }
            }
        }

        function onStageChange(stage) {
            soundStage();
            startMusic();
            document.getElementById('stageNotifIcon').textContent = stage.icon;
            document.getElementById('stageNotifTitle').textContent = 'STAGE ' + stage.num;
            document.getElementById('stageNotifSub').textContent = stage.name;

            const notif = document.getElementById('stageNotif');
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 2200);
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hudScore').textContent = game.score;
            document.getElementById('hudCoins').textContent = game.coins;
            document.getElementById('hudStage').textContent = (game.stageIndex + 1) + '/10';

            const stageStartScore = game.stageIndex * 60;
            const progress = Math.min(((game.score - stageStartScore) / 60) * 100, 100);
            document.getElementById('stageProgress').style.width = Math.max(progress, 0) + '%';
        }

        // ============================================
        // RENDER
        // ============================================
        function render() {
            const stage = getStage();

            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, stage.bg1);
            bgGrad.addColorStop(1, stage.bg2);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let i = 0; i < 50; i++) {
                const sx = (i * 137 + game.frameCount * 0.3) % W;
                const sy = (i * 89) % (H - 150);
                const size = (i % 3) + 1;
                ctx.fillRect(sx, sy, size, size);
            }

            // Ground
            const groundGrad = ctx.createLinearGradient(0, game.groundY - 10, 0, H);
            groundGrad.addColorStop(0, stage.ground);
            groundGrad.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, game.groundY, W, H - game.groundY);

            ctx.fillStyle = stage.ground;
            ctx.shadowColor = stage.ground;
            ctx.shadowBlur = 25;
            ctx.fillRect(0, game.groundY - 3, W, 3);
            ctx.shadowBlur = 0;

            // Speed lines
            game.groundParticles.forEach(p => {
                ctx.fillStyle = stage.ground;
                ctx.globalAlpha = p.life * 0.6;
                ctx.fillRect(p.x, game.groundY + 5, 20, 2);
            });
            ctx.globalAlpha = 1;

            // Obstacles
            game.obstacles.forEach(obs => {
                ctx.shadowColor = stage.accent;
                ctx.shadowBlur = 22;

                if (obs.type === 'triangle') {
                    ctx.fillStyle = stage.accent;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = stage.accent;
                    roundRect(ctx, obs.x, obs.y, obs.width, obs.height, 6);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 2;
                    roundRect(ctx, obs.x, obs.y, obs.width, obs.height, 6);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            });

            // Coins
            game.coinItems.forEach(coin => {
                ctx.save();
                ctx.translate(coin.x + coin.size / 2, coin.y + coin.size / 2 + Math.sin(coin.bob) * 5);
                ctx.shadowColor = '#ffd60a';
                ctx.shadowBlur = 28;
                ctx.fillStyle = '#ffd60a';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ccaa00';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size / 2 - 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffd60a';
                ctx.font = 'bold 16px Orbitron, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 1);
                ctx.restore();
            });

            // Particles
            game.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            renderPlayer();

            // Vignette
            const vignette = ctx.createRadialGradient(W / 2, H / 2, H / 3, W / 2, H / 2, H);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);
        }

        function renderPlayer() {
            const p = game.player;
            const color = getCurrentColor();
            const char = getCurrentChar();

            ctx.save();
            ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
            ctx.rotate(p.rotation);

            ctx.shadowColor = color.primary;
            ctx.shadowBlur = 32;

            if (char.emoji !== '⬛') {
                ctx.font = `${p.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char.emoji, 0, 2);
            } else {
                const grad = ctx.createLinearGradient(-p.size / 2, -p.size / 2, p.size / 2, p.size / 2);

                if (color.isRainbow) {
                    const hue = (game.frameCount * 3) % 360;
                    grad.addColorStop(0, `hsl(${hue}, 100%, 60%)`);
                    grad.addColorStop(1, `hsl(${(hue + 60) % 360}, 100%, 50%)`);
                } else {
                    grad.addColorStop(0, color.primary);
                    grad.addColorStop(1, color.secondary);
                }

                ctx.fillStyle = grad;
                roundRect(ctx, -p.size / 2, -p.size / 2, p.size, p.size, 8);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = 2;
                roundRect(ctx, -p.size / 2 + 6, -p.size / 2 + 6, p.size - 12, p.size - 12, 5);
                ctx.stroke();

                drawEyes(gameData.face.eyeStyle);
                drawMouth(gameData.face.mouthStyle);
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawEyes(style) {
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#05060f';
            ctx.lineWidth = 2;

            switch (style) {
                case 'normal':
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, 0, Math.PI * 2);
                    ctx.arc(7, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 2, 0, Math.PI * 2);
                    ctx.arc(7, -3, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'happy':
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, Math.PI, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(7, -4, 4, Math.PI, 0);
                    ctx.stroke();
                    break;
                case 'angry':
                    ctx.beginPath();
                    ctx.moveTo(-11, -8); ctx.lineTo(-3, -6); ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(11, -8); ctx.lineTo(3, -6); ctx.stroke();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -2, 2, 0, Math.PI * 2);
                    ctx.arc(7, -2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'cool':
                    ctx.fillStyle = '#05060f';
                    ctx.fillRect(-12, -7, 10, 6);
                    ctx.fillRect(2, -7, 10, 6);
                    ctx.beginPath();
                    ctx.moveTo(-2, -4); ctx.lineTo(2, -4); ctx.stroke();
                    break;
                case 'wink':
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(3, -4); ctx.lineTo(11, -4); ctx.stroke();
                    break;
                case 'heart':
                    ctx.fillStyle = '#ff2e97';
                    ctx.font = '10px serif'; ctx.textAlign = 'center';
                    ctx.fillText('❤', -7, -1); ctx.fillText('❤', 7, -1);
                    break;
                case 'star':
                    ctx.fillStyle = '#ffd60a';
                    ctx.font = '10px serif'; ctx.textAlign = 'center';
                    ctx.fillText('★', -7, -1); ctx.fillText('★', 7, -1);
                    break;
                case 'dead':
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-11, -8); ctx.lineTo(-3, 0);
                    ctx.moveTo(-3, -8); ctx.lineTo(-11, 0);
                    ctx.moveTo(3, -8); ctx.lineTo(11, 0);
                    ctx.moveTo(11, -8); ctx.lineTo(3, 0);
                    ctx.stroke();
                    break;
            }
        }

        function drawMouth(style) {
            ctx.strokeStyle = '#05060f';
            ctx.fillStyle = '#05060f';
            ctx.lineWidth = 2;

            switch (style) {
                case 'smile':
                    ctx.beginPath();
                    ctx.arc(0, 4, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
                    break;
                case 'neutral':
                    ctx.beginPath();
                    ctx.moveTo(-4, 6); ctx.lineTo(4, 6); ctx.stroke();
                    break;
                case 'sad':
                    ctx.beginPath();
                    ctx.arc(0, 10, 4, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke();
                    break;
                case 'open':
                    ctx.beginPath();
                    ctx.arc(0, 6, 4, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'laugh':
                    ctx.beginPath();
                    ctx.arc(0, 4, 5, 0, Math.PI); ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.fillRect(-2, 4, 4, 2);
                    break;
                case 'tongue':
                    ctx.beginPath();
                    ctx.arc(0, 4, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
                    ctx.fillStyle = '#ff3860';
                    ctx.beginPath();
                    ctx.ellipse(0, 8, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'kiss':
                    ctx.fillStyle = '#ff3860';
                    ctx.beginPath();
                    ctx.ellipse(0, 6, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'fire':
                    ctx.fillStyle = '#ff8c42';
                    ctx.font = '8px serif'; ctx.textAlign = 'center';
                    ctx.fillText('🔥', 0, 8);
                    break;
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // ============================================
        // GAME OVER
        // ============================================
        function gameOver() {
            game.over = true;
            game.running = false;
            stopMusic();
            soundHit();

            if (game.score > gameData.bestScore) gameData.bestScore = game.score;
            gameData.totalGames++;

            // Save current stage progress
            const stageNum = game.stageIndex + 1;
            const stageStartScore = game.stageIndex * 60;
            const progress = Math.min(Math.floor(((game.score - stageStartScore) / 60) * 100), 100);
            if (progress > (gameData.stageProgress[stageNum] || 0)) {
                gameData.stageProgress[stageNum] = progress;
            }
            saveData();

            document.getElementById('gameoverScore').textContent = game.score;
            document.getElementById('gameoverCoins').textContent = game.coins;
            document.getElementById('gameoverBest').textContent = gameData.bestScore;

            showHUD(false);
            showScreen('screenGameOver');
        }

        function goToMenu() {
            stopMusic();
            showScreen('screenMenu');
            updateMenu();
            game.running = false;
            game.over = false;
        }

        function pauseGame() {
            if (!game.running || game.over) return;
            game.paused = !game.paused;
            const btn = document.querySelector('.pause-btn');
            btn.textContent = game.paused ? '▶' : '⏸';
        }

        // ============================================
        // INPUT
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                jump();
            }
            if (e.code === 'Escape' && game.running) pauseGame();
        });

        canvas.addEventListener('mousedown', () => {
            if (game.running && !game.over && !game.paused) jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (game.running && !game.over && !game.paused) jump();
        }, { passive: false });

        // ============================================
        // INIT
        // ============================================
        window.addEventListener('load', () => {
            updateMenu();
        });
    </script>
</body>
</html>

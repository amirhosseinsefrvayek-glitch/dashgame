<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DASH — نئون دش</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        :root {
            --neon-cyan: #00f0ff;
            --neon-purple: #b537f2;
            --neon-pink: #ff2e97;
            --neon-yellow: #ffd60a;
            --neon-green: #06ffa5;
            --neon-orange: #ff8c42;
            --bg-dark: #05060f;
            --text: #ffffff;
            --text-dim: #8888aa;
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(15, 15, 35, 0.85);
        }

        html, body {
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }

        #gameCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        .hud {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .hud-top {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .hud-box {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 14px;
            pointer-events: auto;
            min-width: 80px;
            text-align: center;
        }

        .hud-label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .hud-value {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 900;
            line-height: 1;
        }

        .hud-value.score { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
        .hud-value.best { color: var(--neon-yellow); text-shadow: 0 0 15px var(--neon-yellow); }
        .hud-value.coins { color: var(--neon-yellow); text-shadow: 0 0 15px var(--neon-yellow); }
        .hud-value.stage { color: var(--neon-purple); text-shadow: 0 0 15px var(--neon-purple); }

        .stage-progress {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .stage-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 2px;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .pause-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }

        .pause-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
            background: rgba(5, 6, 15, 0.95);
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .screen.active { display: flex; animation: screenIn 0.4s ease; }
        @keyframes screenIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

        .title-box { text-align: center; max-width: 500px; width: 100%; }

        .title-logo {
            font-size: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 40px var(--neon-cyan));
            animation: logoFloat 3s infinite ease-in-out;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        .title-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .title-sub {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 4px;
            margin-bottom: 40px;
            font-family: 'Orbitron', sans-serif;
        }

        .menu-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .menu-stat {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
        }

        .menu-stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 4px;
        }

        .menu-stat-label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
            width: 100%;
            margin: 0 auto;
        }

        .menu-btn {
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            border: none;
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.5);
        }

        .menu-btn.secondary {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }

        .menu-btn.secondary:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .shop-header { text-align: center; margin-bottom: 25px; }

        .shop-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .shop-coins {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 214, 10, 0.1);
            border: 1px solid var(--neon-yellow);
            border-radius: 20px;
            padding: 8px 18px;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 900;
            color: var(--neon-yellow);
            box-shadow: 0 0 20px rgba(255, 214, 10, 0.3);
        }

        .shop-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--glass);
            padding: 6px;
            border-radius: 12px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .shop-tab {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .shop-tab.active {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.3);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 55vh;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
        }

        .shop-grid::-webkit-scrollbar { width: 4px; }
        .shop-grid::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 2px; }

        .shop-item {
            background: var(--glass);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .shop-item:hover { transform: translateY(-3px); border-color: var(--neon-cyan); }
        .shop-item.owned { border-color: var(--neon-green); background: rgba(6, 255, 165, 0.08); }
        .shop-item.equipped {
            border-color: var(--neon-yellow);
            background: rgba(255, 214, 10, 0.1);
            box-shadow: 0 0 25px rgba(255, 214, 10, 0.3);
        }

        .shop-item-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .shop-item-name {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 4px;
        }

        .shop-item-price {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 900;
            color: var(--neon-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .shop-item-owned { font-size: 11px; font-weight: 800; color: var(--neon-green); }
        .shop-item-equipped { font-size: 11px; font-weight: 800; color: var(--neon-yellow); }

        .gameover-box {
            text-align: center;
            max-width: 400px;
            width: 100%;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
        }

        .gameover-icon { font-size: 70px; margin-bottom: 15px; }

        .gameover-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--neon-pink);
            margin-bottom: 20px;
        }

        .gameover-stats { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }

        .gameover-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 14px;
        }

        .gameover-stat-label { color: var(--text-dim); font-weight: 700; }
        .gameover-stat-value {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            color: var(--neon-cyan);
        }

        .stage-notif {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--glass);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 25px 40px;
            z-index: 50;
            text-align: center;
            box-shadow: 0 0 60px rgba(181, 55, 242, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stage-notif.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .stage-notif-icon { font-size: 50px; margin-bottom: 10px; }
        .stage-notif-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--neon-purple);
            margin-bottom: 5px;
        }
        .stage-notif-sub { font-size: 14px; color: var(--text-dim); }

        /* FACE CUSTOMIZER */
        .face-section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 15px;
            max-width: 500px;
            width: 100%;
        }

        .face-section-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--neon-cyan);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .face-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .face-option {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
        }

        .face-option:hover { border-color: var(--neon-cyan); transform: scale(1.1); }
        .face-option.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .face-option.color-option {
            background: var(--opt-color, #00f0ff);
        }

        @media (max-width: 600px) {
            .title-text { font-size: 36px; letter-spacing: 4px; }
            .title-logo { font-size: 55px; }
            .menu-stat-value { font-size: 20px; }
            .shop-title { font-size: 24px; }
            .gameover-title { font-size: 24px; }
            .hud-value { font-size: 16px; }
            .hud-box { padding: 6px 10px; min-width: 60px; }
            .stage-progress { width: 140px; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="hud" id="hud" style="display: none;">
        <div class="hud-top">
            <div class="hud-box">
                <div class="hud-label" id="lblScore">امتیاز</div>
                <div class="hud-value score" id="hudScore">0</div>
            </div>
            <div class="hud-box" style="border-color: var(--neon-yellow);">
                <div class="hud-label" id="lblCoins">🪙 سکه</div>
                <div class="hud-value coins" id="hudCoins">0</div>
            </div>
            <div class="hud-box" style="border-color: var(--neon-purple);">
                <div class="hud-label" id="lblStage">مرحله</div>
                <div class="hud-value stage" id="hudStage">1</div>
            </div>
        </div>
        <div class="stage-progress">
            <div class="stage-progress-fill" id="stageProgress"></div>
        </div>
        <button class="pause-btn" onclick="pauseGame()">⏸</button>
    </div>

    <div class="stage-notif" id="stageNotif">
        <div class="stage-notif-icon" id="stageNotifIcon">🎉</div>
        <div class="stage-notif-title" id="stageNotifTitle">مرحله جدید!</div>
        <div class="stage-notif-sub" id="stageNotifSub">محیط عوض شد</div>
    </div>

    <!-- MENU -->
    <div class="screen active" id="screenMenu">
        <div class="title-box">
            <div class="title-logo">⚡</div>
            <h1 class="title-text">NEON DASH</h1>
            <p class="title-sub">نئون دش</p>

            <div class="menu-stats">
                <div class="menu-stat">
                    <div class="menu-stat-value" id="menuBest">0</div>
                    <div class="menu-stat-label" id="lblBest">رکورد</div>
                </div>
                <div class="menu-stat">
                    <div class="menu-stat-value" id="menuCoins">0</div>
                    <div class="menu-stat-label" id="lblMenuCoins">سکه</div>
                </div>
                <div class="menu-stat">
                    <div class="menu-stat-value" id="menuChars">1</div>
                    <div class="menu-stat-label" id="lblMenuChars">کاراکتر</div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="menu-btn" onclick="startGame()">
                    <span>▶</span>
                    <span id="btnPlay">شروع بازی</span>
                </button>
                <button class="menu-btn secondary" onclick="openShop()">
                    <span>🛒</span>
                    <span id="btnShop">فروشگاه</span>
                </button>
                <button class="menu-btn secondary" onclick="toggleLanguage()">
                    <span>🌐</span>
                    <span id="btnLang">English</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SHOP -->
    <div class="screen" id="screenShop">
        <div class="shop-header">
            <h2 class="shop-title" id="shopTitle">🛒 فروشگاه</h2>
            <div class="shop-coins">
                <span>🪙</span>
                <span id="shopCoins">0</span>
            </div>
        </div>

        <div class="shop-tabs">
            <button class="shop-tab active" onclick="switchShopTab('colors', this)" id="tabColors">🎨 رنگ‌ها</button>
            <button class="shop-tab" onclick="switchShopTab('chars', this)" id="tabChars">👤 کاراکترها</button>
            <button class="shop-tab" onclick="switchShopTab('face', this)" id="tabFace">😊 چهره</button>
        </div>

        <div class="shop-grid" id="shopGrid"></div>

        <div class="menu-buttons" style="max-width: 300px;">
            <button class="menu-btn secondary" onclick="closeShop()">
                <span>←</span>
                <span id="btnBack">بازگشت</span>
            </button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div class="screen" id="screenGameOver">
        <div class="gameover-box">
            <div class="gameover-icon">💥</div>
            <h2 class="gameover-title" id="gameoverTitle">پایان!</h2>
            
            <div class="gameover-stats">
                <div class="gameover-stat">
                    <span class="gameover-stat-label" id="lblScore2">امتیاز</span>
                    <span class="gameover-stat-value" id="gameoverScore">0</span>
                </div>
                <div class="gameover-stat">
                    <span class="gameover-stat-label" id="lblCoins2">سکه‌ها</span>
                    <span class="gameover-stat-value" id="gameoverCoins">0</span>
                </div>
                <div class="gameover-stat">
                    <span class="gameover-stat-label" id="lblBest2">رکورد</span>
                    <span class="gameover-stat-value" id="gameoverBest">0</span>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="menu-btn" onclick="startGame()">
                    <span>🔄</span>
                    <span id="btnRetry">دوباره بازی</span>
                </button>
                <button class="menu-btn secondary" onclick="goToMenu()">
                    <span>🏠</span>
                    <span id="btnMenu">منوی اصلی</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TRANSLATIONS
        // ============================================
        const T = {
            fa: {
                score: 'امتیاز', coins: '🪙 سکه', stage: 'مرحله', best: 'رکورد',
                play: 'شروع بازی', shop: 'فروشگاه', lang: 'English',
                shopTitle: '🛒 فروشگاه',
                tabColors: '🎨 رنگ‌ها', tabChars: '👤 کاراکترها', tabFace: '😊 چهره',
                back: 'بازگشت', gameover: 'پایان!', coins2: 'سکه‌ها',
                retry: 'دوباره بازی', menu: 'منوی اصلی',
                stageNotif: 'مرحله جدید!', stageNotifSub: 'محیط عوض شد',
                owned: 'دارید', equipped: 'فعال',
                notEnoughCoins: 'سکه کافی نداری!',
                menuChars: 'کاراکتر',
                faceEyes: 'چشم‌ها', faceMouth: 'دهن', faceBodyColor: 'رنگ بدن'
            },
            en: {
                score: 'SCORE', coins: '🪙 COINS', stage: 'STAGE', best: 'BEST',
                play: 'Play', shop: 'Shop', lang: 'فارسی',
                shopTitle: '🛒 Shop',
                tabColors: '🎨 Colors', tabChars: '👤 Chars', tabFace: '😊 Face',
                back: 'Back', gameover: 'Game Over!', coins2: 'Coins',
                retry: 'Retry', menu: 'Menu',
                stageNotif: 'New Stage!', stageNotifSub: 'Environment changed',
                owned: 'Owned', equipped: 'Equipped',
                notEnoughCoins: 'Not enough coins!',
                menuChars: 'Chars',
                faceEyes: 'Eyes', faceMouth: 'Mouth', faceBodyColor: 'Body Color'
            }
        };

        let currentLang = 'fa';
        function t(key) { return T[currentLang][key]; }

        // ============================================
        // GAME DATA
        // ============================================
        let gameData = JSON.parse(localStorage.getItem('neonDashData') || 'null') || {
            bestScore: 0,
            coins: 0,
            ownedColors: ['cyan'],
            ownedChars: ['default'],
            equippedColor: 'cyan',
            equippedChar: 'default',
            face: {
                eyeStyle: 'normal',
                mouthStyle: 'smile',
                bodyColor: 'auto'
            },
            totalGames: 0
        };

        if (!gameData.face) {
            gameData.face = { eyeStyle: 'normal', mouthStyle: 'smile', bodyColor: 'auto' };
        }

        function saveData() {
            localStorage.setItem('neonDashData', JSON.stringify(gameData));
        }

        // ============================================
        // COLORS
        // ============================================
        const COLORS = {

        function initAudio() {

            }
        }

        function playSound(freq, duration, type = 'sine', volume = 0.1) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function startGame() {
            initAudio();
            showScreen(null);
            showHUD(true);

            game.running = true;
            game.over = false;
            game.paused = false;
            game.score = 0;
            game.coins = 0;
            game.stage = 1;
            game.speed = game.baseSpeed;
            game.obstacles = [];
            game.coinItems = [];
            game.particles = [];
            game.spawnTimer = 0;
            game.spawnInterval = 120;
            game.coinSpawnTimer = 0;
            game.coinSpawnInterval = 60;
            game.frameCount = 0;
            game.groundParticles = [];

            game.groundY = H - 80;
            game.player.x = 100;
            game.player.y = game.groundY - game.player.size;
            game.player.vy = 0;
            game.player.rotation = 0;
            game.player.onGround = true;

            updateHUD();
            gameLoop();
        }

        function gameLoop() {
            if (!game.running) return;
            if (!game.paused) update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (game.over) return;
            game.frameCount++;
            game.speed += 0.0005;

            const newStage = Math.floor(game.score / 80) + 1;
            if (newStage !== game.stage) {
                game.stage = newStage;
                onStageChange();
            }

            updatePlayer();
            updateObstacles();
            updateCoins();
            updateParticles();

            game.spawnTimer++;
            if (game.spawnTimer >= game.spawnInterval) {
                game.spawnTimer = 0;
                spawnObstacle();
                if (game.spawnInterval > 70) game.spawnInterval -= 0.3;
            }

            game.coinSpawnTimer++;
            if (game.coinSpawnTimer >= game.coinSpawnInterval) {
                game.coinSpawnTimer = 0;
                spawnCoin();
            }

            if (game.frameCount % 6 === 0) {
                game.score++;
                updateHUD();
            }

            if (game.frameCount % 3 === 0) {
                game.groundParticles.push({ x: W, y: game.groundY, life: 1, speed: game.speed });
            }
            game.groundParticles.forEach((p, i) => {
                p.x -= p.speed;
                p.life -= 0.02;
                if (p.life <= 0 || p.x < -10) game.groundParticles.splice(i, 1);
            });
        }

        function updatePlayer() {
            const p = game.player;
            p.vy += game.gravity;
            p.y += p.vy;

            if (p.y + p.size >= game.groundY) {
                p.y = game.groundY - p.size;
                p.vy = 0;
                p.onGround = true;
                p.rotation *= 0.9;
            } else {
                p.onGround = false;
                p.rotation += 0.1;
            }
        }

        function updateObstacles() {
            for (let i = game.obstacles.length - 1; i >= 0; i--) {
                const obs = game.obstacles[i];
                obs.x -= game.speed;

                if (checkCollision(game.player, obs)) {
                    gameOver();
                    return;
                }

                if (obs.x + obs.width < -50) game.obstacles.splice(i, 1);
            }
        }

        function updateCoins() {
            for (let i = game.coinItems.length - 1; i >= 0; i--) {
                const coin = game.coinItems[i];
                coin.x -= game.speed;
                coin.rotation += 0.15;
                coin.bob += 0.1;

                if (checkCoinCollision(game.player, coin)) {
                    game.coins++;
                    gameData.coins++;
                    updateHUD();
                    playSound(1000, 0.1, 'sine', 0.08);
                    setTimeout(() => playSound(1300, 0.1, 'sine', 0.08), 50);

                    for (let j = 0; j < 8; j++) {
                        game.particles.push({
                            x: coin.x + coin.size / 2,
                            y: coin.y + coin.size / 2,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            life: 1,
                            color: '#ffd60a',
                            size: 3
                        });
                    }
                    game.coinItems.splice(i, 1);
                } else if (coin.x + coin.size < -50) {
                    game.coinItems.splice(i, 1);
                }
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= 0.02;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
        }

        function spawnObstacle() {
            const types = ['box', 'triangle', 'double', 'tall'];
            const type = types[Math.floor(Math.random() * types.length)];

            let obs = { x: W + 20, width: 40, height: 40, y: game.groundY - 40, type };

            if (type === 'triangle') { obs.width = 40; obs.height = 50; obs.y = game.groundY - 50; }
            else if (type === 'double') { obs.width = 70; obs.height = 35; obs.y = game.groundY - 35; }
            else if (type === 'tall') { obs.width = 35; obs.height = 70; obs.y = game.groundY - 70; }

            game.obstacles.push(obs);
        }

        function spawnCoin() {
            const tooClose = game.obstacles.some(o => o.x > W - 100);
            if (tooClose) return;

            const patterns = [
                [{ x: W + 20, y: game.groundY - 150 }],
                [
                    { x: W + 20, y: game.groundY - 120 },
                    { x: W + 70, y: game.groundY - 120 },
                    { x: W + 120, y: game.groundY - 120 }
                ],
                [
                    { x: W + 20, y: game.groundY - 80 },
                    { x: W + 60, y: game.groundY - 150 },
                    { x: W + 100, y: game.groundY - 80 }
                ]
            ];

            const pattern = patterns[Math.floor(Math.random() * patterns.length)];
            pattern.forEach(pos => {
                game.coinItems.push({
                    x: pos.x, y: pos.y, size: 30,
                    rotation: 0, bob: Math.random() * Math.PI * 2
                });
            });
        }

        function checkCollision(player, obs) {
            const px = player.x + 5;
            const py = player.y + 5;
            const ps = player.size - 10;
            return px < obs.x + obs.width && px + ps > obs.x && py < obs.y + obs.height && py + ps > obs.y;
        }

        function checkCoinCollision(player, coin) {
            const pcx = player.x + player.size / 2;
            const pcy = player.y + player.size / 2;
            const ccx = coin.x + coin.size / 2;
            const ccy = coin.y + coin.size / 2;
            const dx = pcx - ccx;
            const dy = pcy - ccy;
            return Math.sqrt(dx * dx + dy * dy) < (player.size / 2 + coin.size / 2);
        }

        function jump() {
            if (!game.running || game.over || game.paused) return;
            if (game.player.onGround) {
                game.player.vy = game.jumpForce;
                game.player.onGround = false;
                soundJump();

                for (let i = 0; i < 6; i++) {
                    game.particles.push({
                        x: game.player.x + game.player.size / 2,
                        y: game.player.y + game.player.size,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3,
                        life: 1,
                        color: getCurrentColor().primary,
                        size: 3
                    });
                }
            }
        }

        function onStageChange() {
            soundStage();
            const theme = getStageTheme();
            document.getElementById('stageNotifIcon').textContent = '🎉';
            document.getElementById('stageNotifTitle').textContent = t('stageNotif');
            document.getElementById('stageNotifSub').textContent = theme.name[currentLang];

            const notif = document.getElementById('stageNotif');
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 2000);

            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hudScore').textContent = game.score;
            document.getElementById('hudCoins').textContent = game.coins;
            document.getElementById('hudStage').textContent = game.stage;
            const progress = ((game.score % 80) / 80) * 100;
            document.getElementById('stageProgress').style.width = progress + '%';
        }

        // ============================================
        // RENDER
        // ============================================
        function render() {
            const theme = getStageTheme();

            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, theme.bg1);
            bgGrad.addColorStop(1, theme.bg2);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            for (let i = 0; i < 40; i++) {
                const sx = (i * 137 + game.frameCount * 0.3) % W;
                const sy = (i * 89) % (H - 150);
                const size = (i % 3) + 1;
                ctx.fillRect(sx, sy, size, size);
            }

            const groundGrad = ctx.createLinearGradient(0, game.groundY - 10, 0, H);
            groundGrad.addColorStop(0, theme.ground);
            groundGrad.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, game.groundY, W, H - game.groundY);

            ctx.fillStyle = theme.ground;
            ctx.shadowColor = theme.ground;
            ctx.shadowBlur = 20;
            ctx.fillRect(0, game.groundY - 3, W, 3);
            ctx.shadowBlur = 0;

            game.groundParticles.forEach(p => {
                ctx.fillStyle = theme.ground;
                ctx.globalAlpha = p.life * 0.6;
                ctx.fillRect(p.x, game.groundY + 5, 20, 2);
            });
            ctx.globalAlpha = 1;

            game.obstacles.forEach(obs => {
                ctx.shadowColor = theme.accent;
                ctx.shadowBlur = 20;

                if (obs.type === 'triangle') {
                    ctx.fillStyle = theme.accent;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = theme.accent;
                    roundRect(ctx, obs.x, obs.y, obs.width, obs.height, 6);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    roundRect(ctx, obs.x, obs.y, obs.width, obs.height, 6);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            });

            game.coinItems.forEach(coin => {
                ctx.save();
                ctx.translate(coin.x + coin.size / 2, coin.y + coin.size / 2 + Math.sin(coin.bob) * 5);
                ctx.shadowColor = '#ffd60a';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#ffd60a';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ccaa00';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size / 2 - 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffd60a';
                ctx.font = 'bold 16px Orbitron, monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 1);
                ctx.restore();
            });

            game.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            renderPlayer();

            const vignette = ctx.createRadialGradient(W / 2, H / 2, H / 3, W / 2, H / 2, H);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);
        }

        function renderPlayer() {
            const p = game.player;
            let color = getCurrentColor();

            // Override body color if face customization has one
            if (gameData.face.bodyColor !== 'auto' && COLORS[gameData.face.bodyColor]) {
                color = COLORS[gameData.face.bodyColor];
            }

            const char = getCurrentChar();

            ctx.save();
            ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
            ctx.rotate(p.rotation);

            ctx.shadowColor = color.primary;
            ctx.shadowBlur = 30;

            if (char.emoji !== '⬛') {
                ctx.font = `${p.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char.emoji, 0, 2);
            } else {
                const grad = ctx.createLinearGradient(-p.size / 2, -p.size / 2, p.size / 2, p.size / 2);

                if (color.isRainbow) {
                    const hue = (game.frameCount * 3) % 360;
                    grad.addColorStop(0, `hsl(${hue}, 100%, 60%)`);
                    grad.addColorStop(1, `hsl(${(hue + 60) % 360}, 100%, 50%)`);
                } else {
                    grad.addColorStop(0, color.primary);
                    grad.addColorStop(1, color.secondary);
                }

                ctx.fillStyle = grad;
                roundRect(ctx, -p.size / 2, -p.size / 2, p.size, p.size, 8);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                roundRect(ctx, -p.size / 2 + 6, -p.size / 2 + 6, p.size - 12, p.size - 12, 5);
                ctx.stroke();

                // Custom eyes
                drawEyes(gameData.face.eyeStyle);
                // Custom mouth
                drawMouth(gameData.face.mouthStyle);
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        function drawEyes(style) {
            ctx.fillStyle = 'white';
            ctx.strokeStyle = '#05060f';
            ctx.lineWidth = 2;

            switch (style) {
                case 'normal':
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, 0, Math.PI * 2);
                    ctx.arc(7, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 2, 0, Math.PI * 2);
                    ctx.arc(7, -3, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'happy':
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, Math.PI, 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(7, -4, 4, Math.PI, 0);
                    ctx.stroke();
                    break;
                case 'angry':
                    ctx.beginPath();
                    ctx.moveTo(-11, -8);
                    ctx.lineTo(-3, -6);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(11, -8);
                    ctx.lineTo(3, -6);
                    ctx.stroke();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -2, 2, 0, Math.PI * 2);
                    ctx.arc(7, -2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'cool':
                    ctx.fillStyle = '#05060f';
                    ctx.fillRect(-12, -7, 10, 6);
                    ctx.fillRect(2, -7, 10, 6);
                    ctx.beginPath();
                    ctx.moveTo(-2, -4);
                    ctx.lineTo(2, -4);
                    ctx.stroke();
                    break;
                case 'wink':
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(-7, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#05060f';
                    ctx.beginPath();
                    ctx.arc(-7, -3, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(3, -4);
                    ctx.lineTo(11, -4);
                    ctx.stroke();
                    break;
                case 'heart':
                    ctx.fillStyle = '#ff2e97';
                    ctx.font = '10px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('❤', -7, -1);
                    ctx.fillText('❤', 7, -1);
                    break;
                case 'star':
                    ctx.fillStyle = '#ffd60a';
                    ctx.font = '10px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', -7, -1);
                    ctx.fillText('★', 7, -1);
                    break;
                case 'dead':
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-11, -8);
                    ctx.lineTo(-3, 0);
                    ctx.moveTo(-3, -8);
                    ctx.lineTo(-11, 0);
                    ctx.moveTo(3, -8);
                    ctx.lineTo(11, 0);
                    ctx.moveTo(11, -8);
                    ctx.lineTo(3, 0);
                    ctx.stroke();
                    break;
            }
        }

        function drawMouth(style) {
            ctx.strokeStyle = '#05060f';
            ctx.fillStyle = '#05060f';
            ctx.lineWidth = 2;

            switch (style) {
                case 'smile':
                    ctx.beginPath();
                    ctx.arc(0, 4, 4, 0.2 * Math.PI, 0.8 * Math.PI);
                    ctx.stroke();
                    break;
                case 'neutral':
                    ctx.beginPath();
                    ctx.moveTo(-4, 6);
                    ctx.lineTo(4, 6);
                    ctx.stroke();
                    break;
                case 'sad':
                    ctx.beginPath();
                    ctx.arc(0, 10, 4, 1.2 * Math.PI, 1.8 * Math.PI);
                    ctx.stroke();
                    break;
                case 'open':
                    ctx.beginPath();
                    ctx.arc(0, 6, 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'laugh':
                    ctx.beginPath();
                    ctx.arc(0, 4, 5, 0, Math.PI);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.fillRect(-2, 4, 4, 2);
                    break;
                case 'tongue':
                    ctx.beginPath();
                    ctx.arc(0, 4, 4, 0.2 * Math.PI, 0.8 * Math.PI);
                    ctx.stroke();
                    ctx.fillStyle = '#ff3860';
                    ctx.beginPath();
                    ctx.ellipse(0, 8, 2, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'kiss':
                    ctx.fillStyle = '#ff3860';
                    ctx.beginPath();
                    ctx.ellipse(0, 6, 3, 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'fire':
                    ctx.fillStyle = '#ff8c42';
                    ctx.font = '8px serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('🔥', 0, 8);
                    break;
            }
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // ============================================
        // GAME OVER
        // ============================================
        function gameOver() {
            game.over = true;
            game.running = false;
            soundHit();

            if (game.score > gameData.bestScore) gameData.bestScore = game.score;
            gameData.totalGames++;
            saveData();

            document.getElementById('gameoverScore').textContent = game.score;
            document.getElementById('gameoverCoins').textContent = game.coins;
            document.getElementById('gameoverBest').textContent = gameData.bestScore;

            showHUD(false);
            showScreen('screenGameOver');
        }

        function goToMenu() {
            showScreen('screenMenu');
            updateMenu();
            game.running = false;
            game.over = false;
        }

        function pauseGame() {
            if (!game.running || game.over) return;
            game.paused = !game.paused;
            const btn = document.querySelector('.pause-btn');
            btn.textContent = game.paused ? '▶' : '⏸';
        }

        // ============================================
        // INPUT
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                e.preventDefault();
                jump();
            }
            if (e.code === 'Escape' && game.running) pauseGame();
        });

        canvas.addEventListener('mousedown', () => {
            if (game.running && !game.over && !game.paused) jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (game.running && !game.over && !game.paused) jump();
        }, { passive: false });

        // ============================================
        // INIT
        // ============================================
        window.addEventListener('load', () => {
            const savedLang = localStorage.getItem('neonDashLang');
            if (savedLang) currentLang = savedLang;
            applyLanguage();
            updateMenu();
        });

    </script>
</body>
</html>
